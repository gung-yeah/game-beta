에요. 좋아하는 담요와 장난감을 넣어 좋은 기억을 만들어 줘요.","cost":"하우스(켄넬) 약 3~10만 원","why":{"near":"곁에서 차분히 있어 주면 \\"여기는 안전한 곳\\"이라고 배워요. 며칠 지나면 혼자서도 잠들어요.","bed":"안아 주는 건 따뜻한 마음이지만, 매번 꺼내 주면 \\"울면 나갈 수 있다\\"고 배울 수 있어요. 하우스 옆에서 달래 주는 게 좋아요.","away":"엄마와 처음 떨어진 아기에게 혼자 남겨지는 건 아주 무서운 일이에요. 첫 며칠은 곁에서 안심시켜 주세요."}},{"id":"toy","title":"깨무는 건 자연스러운 일","text":"이가 나는 시기에는 뭐든 깨물고 싶어 해요. 손을 물면 놀이를 멈추고, 깨물어도 되는 장난감을 대신 주세요."},{"id":"vaccine","title":"예방접종 일정","text":"생후 6~8주부터 2~4주 간격으로 종합백신을 맞아요. 접종이 끝나기 전에는 다른 강아지가 많은 곳은 피하는 게 좋아요.","cost":"첫 진료 + 접종 약 3~6만 원","why":{"calm":"익숙한 사람이 차분하게 안아 주고, 끝나면 좋은 일(간식)이 생기면 병원을 덜 무서워하게 돼요. 접종 전에는 바닥을 걷지 않게 품에 안고 다녀요.","hold":"억지로 누르면 병원 = 무서운 곳으로 기억해요. 보정은 수의사 선생님과 함께 부드럽게 해요.","later":"예방접종은 시기를 지켜야 파보 장염·홍역 같은 무서운 병을 막을 수 있어요. 무서워하면 간식과 칭찬으로 도와주며 맞혀요."}},{"id":"name","title":"이름은 좋은 일과 함께","text":"이름을 부르고 다가오면 간식과 칭찬을 줘요. 혼낼 때 이름을 부르면 이름이 싫은 말이 될 수 있어요.","why":{"treat":"이름이 좋은 일과 이어지면, 불렀을 때 기쁘게 달려와요. 위험할 때 불러 세우는 데도 꼭 필요해요.","loud":"큰 소리로 여러 번 부르면 이름이 소음이 되고, 무서워서 피할 수 있어요.","scold":"혼낼 때 이름을 쓰면 이름이 싫은 말이 돼요. 혼낼 땐 이름 대신 \\"안 돼\\" 같은 짧은 말을 써요."}},{"id":"brush","title":"빗질은 짧고 즐겁게","text":"어릴 때부터 짧게 자주 빗질해 주면 몸을 만지는 걸 좋아하게 돼요. 털이 많이 빠지는 견종(골든 리트리버·래브라도·시바견 등)은 빗질이 특히 중요하고, 털이 계속 자라는 견종(푸들·비숑 등)은 엉키지 않게 빗질해 줘요."},{"id":"leash","title":"목줄은 천천히","text":"처음엔 집 안에서 잠깐씩 목줄을 하고 간식을 줘요. 익숙해지면 줄을 달고 집 안을 함께 걸어 봐요.","why":{"slow":"짧게, 좋은 일(간식)과 함께 하면 목줄은 즐거운 산책이라고 배워요.","drag":"억지로 끌면 목줄과 바깥을 무서워하게 될 수 있어요.","skip":"목줄은 강아지를 지켜 주는 안전장치예요. 우리나라는 법으로 외출할 때 목줄을 꼭 하게 되어 있어요."}},{"id":"vaccine_start","title":"종합백신은 6~8주부터","text":"종합백신은 생후 6~8주쯤 시작해서 2~4주 간격으로 여러 번 맞아요. 접종이 끝나기 전에는 다른 강아지가 많은 곳은 피해요.","why":{"go":"정해진 날짜에 맞춰야 면역이 제대로 생겨요.","postpone":"조금 늦는 건 괜찮지만, 그동안 감염 위험이 커져요. 다시 날짜를 꼭 잡아요."},"cost":"종합백신 1회 약 3~5만 원 (병원마다 달라요)"},{"id":"potty_accident","title":"실수에는 침착하게","text":"실수했을 때 혼내면 \\"보호자 앞에서 싸면 혼난다\\"고 배워서 숨어서 싸게 돼요. 조용히 치우고, 성공했을 때 바로 칭찬하는 게 배변 훈련의 기본이에요.","why":{"angry":"혼내면 배변 자체를 숨기게 되고 신뢰가 떨어져요.","calm":"타이밍 맞추기 + 성공하면 바로 칭찬이 가장 빠른 방법이에요."}},{"id":"chewing","title":"이가 날 때는 씹고 싶어요","text":"생후 3~6개월은 이갈이 시기라 뭐든 씹고 싶어 해요. 혼내기보다 씹어도 되는 장난감으로 바꿔 주세요.","why":{"redirect":"하고 싶은 행동(씹기)을 괜찮은 물건으로 바꿔 주는 게 핵심이에요.","ignore":"그냥 두면 신발·가구도 씹어도 된다고 배워요.","scold":"이갈이는 자연스러운 일이라, 혼나면 이유를 모른 채 겁만 먹어요."}},{"id":"deworm","title":"구충제는 정해진 주기에","text":"기생충은 눈에 보이지 않아도 설사·체중 감소를 일으킬 수 있어요. 수의사가 정해 준 주기에 맞춰 꾸준히 먹여요.","why":{"give":"주기를 지키는 게 가장 중요해요.","skip":"한 번쯤 늦어도 되지만, 잊지 않게 날짜를 다시 정해요."},"cost":"구충제 1회 약 5천~1만 원"},{"id":"mouthing","title":"무는 힘 조절 배우기","text":"어린 강아지는 놀면서 \\"얼마나 세게 물면 아픈지\\"를 배워요. 세게 물면 놀이를 잠깐 멈춰서 알려 주세요.","why":{"play_on":"계속 놀아 주면 손을 세게 물어도 된다고 배워요.","stop_firmly":"놀이가 멈추는 게 강아지에게는 가장 확실한 신호예요."}},{"id":"vaccine_schedule","title":"접종은 끝까지","text":"종합백신은 보통 3~5번에 걸쳐 맞아요. 마지막 접종 뒤 2주쯤 지나야 면역이 충분히 생겨요.","why":{"go":"끝까지 맞혀야 파보·홍역 같은 위험한 병을 막을 수 있어요.","postpone":"미룰수록 위험한 시기가 길어져요."}},{"id":"wary_reaction","title":"겁이 날 땐 거리 두기","text":"억지로 무서운 대상 앞에 데려가면 공포가 더 커져요. 강아지가 편안한 거리에서 간식과 함께 좋은 기억을 만들어 줘요.","why":{"approach":"억지로 다가가게 하면 무서운 기억만 남아요.","distance":"편안한 거리에서 시작하는 게 사회화의 기본이에요."}},{"id":"rabies","title":"광견병 접종은 꼭","text":"광견병은 사람에게도 옮을 수 있는 병이라 생후 3개월쯤 꼭 맞히고, 그 뒤로 해마다 맞혀요.","why":{"go":"법으로도 권장되는 중요한 접종이에요.","postpone":"광견병은 걸리면 치료가 어려워요. 꼭 날짜를 잡아요."},"cost":"광견병 접종 약 1~3만 원 (지역 보건소 할인 행사도 있어요)"},{"id":"separation_early","title":"나갈 때는 차분하게","text":"나갈 때 오래 달래 주면 \\"보호자가 나가는 건 큰일\\"이라고 배워요. 장난감을 주고 담담하게 나갔다 오는 연습을 해요.","why":{"comfort":"요란한 인사는 오히려 불안을 키워요.","leave_calmly":"짧고 차분한 외출이 혼자 있는 연습이 돼요."}},{"id":"puppy_summary","title":"퍼피기는 평생의 바탕","text":"생후 6개월까지의 경험이 앞으로의 성격과 행동에 큰 영향을 줘요. 이 시기에 쌓은 신뢰와 습관이 개춘기를 버티는 힘이 돼요."},{"id":"puberty","title":"몸이 어른이 되어 가요","text":"생후 6개월쯤부터 암컷은 첫 발정이 오고, 수컷은 다리를 들고 마킹하거나 마운팅이 늘 수 있어요. 작은 견종은 1년 안에 다 자라지만, 리트리버 같은 대형견은 1년 넘게 걸려요."},{"id":"neuter","title":"중성화는 수의사와 함께 정해요","text":"중성화는 원치 않는 임신을 막고, 암컷의 자궁축농증·유선종양, 수컷의 전립선 질환 위험을 줄여요. 대형견은 너무 이른 중성화가 관절 질환 위험을 높일 수 있다는 연구도 있어서 시기는 수의사와 상의해요.","why":{"now":"건강 상태를 확인하고 정했다면 좋은 선택이에요.","later":"대형견은 성장을 보고 정하는 것도 좋은 방법이에요.","never":"하지 않는 것도 보호자의 선택이에요. 대신 발정기 관리와 정기 검진이 더 중요해져요."},"cost":"중성화 수술 약 20~40만 원 (크기·성별·병원에 따라 달라요)"},{"id":"neuter_recovery","title":"수술 뒤 7~10일","text":"상처를 핥지 않게 넥카라를 씌우고, 뛰거나 목욕하는 건 피해요. 상처가 붓거나 진물이 나면 바로 병원에 가요.","why":{"rest":"답답해도 넥카라와 휴식이 가장 빠른 회복 방법이에요.","walk":"상처를 핥거나 뛰면 염증이 생겨 회복이 더 늦어져요."}},{"id":"chewing_teen","title":"지루하면 더 씹어요","text":"개춘기의 물어뜯기는 에너지가 남거나 지루할 때 심해져요. 산책·공놀이·노즈워크로 에너지를 풀어 주고, 망가지면 안 되는 물건은 미리 치워요.","why":{"redirect":"환경을 바꾸고 대신할 거리를 주는 게 가장 효과적이에요.","ignore":"그냥 두면 씹는 습관이 굳어요.","scold":"강아지는 몇 분 전 일과 혼나는 걸 연결하지 못해요."}},{"id":"leash_pulling","title":"당기면 멈추기","text":"줄을 당길 때 따라가면 \\"당기면 원하는 곳에 간다\\"를 배워요. 줄이 팽팽해지면 멈추고, 느슨해지면 다시 걷기를 반복해요.","why":{"stop_wait":"멈춤 → 느슨해지면 출발, 이걸 반복하는 게 정답이에요.","follow":"따라가면 당기는 행동이 보상을 받아요.","jerk":"줄을 세게 잡아채면 목과 기관지를 다칠 수 있어요."}},{"id":"fear_period","title":"2차 공포기","text":"생후 6~14개월쯤 갑자기 겁이 많아지는 시기가 올 수 있어요. 억지로 다가가게 하면 공포가 오래 남아요. 거리를 두고 간식으로 좋은 기억을 만들어 줘요.","why":{"calm":"거리 + 간식 + 천천히, 공포를 줄이는 기본 방법이에요.","ignore":"지나가는 건 괜찮지만, 좋은 기억을 만들어 주면 더 빨리 나아져요.","force":"억지로 마주하게 하면 공포가 더 깊어져요."}},{"id":"separation_teen","title":"분리불안 신호","text":"혼자 있을 때 오래 짖거나 문을 긁으면 분리불안 신호일 수 있어요. 아주 짧게 나갔다 오는 연습부터 시작해 시간을 늘리고, 심하면 수의사와 상담해요.","why":{"train":"짧은 시간부터 늘려 가는 게 가장 확실한 방법이에요.","ignore":"분리불안은 저절로 나아지기보다 심해지는 경우가 많아요."}},{"id":"mounting","title":"마운팅은 흥분 신호이기도 해요","text":"마운팅은 성적 행동만이 아니라 흥분·놀이·스트레스 때문에도 나와요. 혼내기보다 차분히 떼어 내고 \\"앉아\\" 같은 다른 행동으로 바꿔 줘요.","why":{"stop":"다른 행동으로 바꿔 주는 게 가장 좋아요.","let":"다른 개에게 하면 싸움이 날 수도 있어요."}},{"id":"marking","title":"산책 예절","text":"여기저기 소변을 묻히는 건 영역 표시예요. 남의 집·가게 앞에서는 줄을 짧게 잡고 지나가고, 묻힌 곳은 물로 씻어 주는 게 예의예요.","why":{"stop":"이웃과 함께 사는 예절이에요.","allow":"마킹을 그냥 두면 습관이 되고 이웃에게 피해가 갈 수 있어요."}},{"id":"hard_times","title":"힘든 건 잘못이 아니에요","text":"개춘기는 많은 보호자가 가장 힘들어하는 시기예요. 대부분 두 살 무렵이면 차분해져요. 혼자 버티기 어렵다면 반려견 행동 전문가나 수의 행동 클리닉에 도움을 청해요.","why":{"help":"도움을 청하는 건 책임감 있는 선택이에요.","resolve":"마음을 다잡는 것도 좋아요. 그래도 힘들 땐 언제든 도움을 청해요."}},{"id":"teen_summary","title":"이제 어른 강아지","text":"개춘기에 쌓은 훈련과 신뢰는 앞으로 함께할 성견 생활의 바탕이 돼요. 1년에 한 번은 건강 검진을 받아요."},{"id":"food_label","title":"좋은 사료 고르기","text":"비싼 사료가 꼭 좋은 사료는 아니에요. 성장 단계(퍼피·성견·노령견)에 맞는지, 원재료 표 첫 줄에 고기가 있는지, 급여량을 확인해요. 사료를 바꿀 때는 7~10일에 걸쳐 조금씩 섞어 바꿔야 배탈이 안 나요.","cost":"사료 1kg 약 1~4만 원 (종류에 따라 차이가 커요)"},{"id":"grooming","title":"털 관리는 꾸준히","text":"털이 많이 빠지는 견종은 자주, 털이 계속 자라는 견종은 엉키지 않게 빗질해 줘요. 목욕은 한 달에 1~2번이면 충분하고, 너무 자주 하면 피부가 건조해져요. 발톱은 2~4주마다 다듬고 귀도 살펴봐요. 미용은 강아지에게 낯설 수 있으니 짧게, 간식과 함께 익숙해지게 해요.","cost":"미용 1회 약 3~8만 원 (크기·털 상태에 따라 달라요)"},{"id":"clothes","title":"옷은 필요할 때만","text":"강아지 옷은 추운 날·비 오는 날 체온을 지켜 주지만, 꽉 끼거나 오래 입으면 피부가 짓무를 수 있어요. 싫어하면 억지로 입히지 말고, 입힌 뒤에는 불편해하지 않는지 살펴봐요."},{"id":"ev_sleep","title":"아기 강아지는 잠꾸러기","text":"생후 2~3개월 강아지는 하루 18~20시간을 자요. 자는 동안 몸과 뇌가 자라요. 조용한 잠자리를 마련하고 억지로 깨우지 마세요. 다만 깨어 있을 때도 축 처지고 밥을 안 먹으면 병원에 가요.","why":{"let":"충분히 자야 깨어 있을 때 잘 놀고 잘 배워요.","wake":"자는 아기 강아지를 자꾸 깨우면 예민해지고 피곤이 쌓여요."}},{"id":"ev_social","title":"사회화는 지금부터","text":"생후 3~14주는 세상을 배우는 \\"사회화 시기\\"예요. 이때 여러 사람·소리·물건을 좋은 기억(간식·칭찬)과 함께 조금씩 만나면, 커서도 겁이 적어요. 접종 전에는 집에서, 한 번에 한 명씩, 짧게 만나게 해요.","why":{"quiet":"한 명씩 조용히, 간식과 함께 만나면 사람 = 좋은 일로 기억해요.","party":"한꺼번에 많은 사람은 아기 강아지에게 무서운 경험이 될 수 있어요.","no":"아무도 안 만나면 이 시기를 놓쳐 낯선 사람을 무서워할 수 있어요."}},{"id":"ev_bath","title":"목욕은 천천히","text":"집에 온 지 얼마 안 된 아기 강아지는 체온 조절이 서툴고 스트레스에 약해요. 전신 목욕은 적응하고 기본 접종을 시작한 뒤에, 짧고 따뜻하게 해요. 그 전에는 더러운 곳만 닦아 줘요.","why":{"wipe":"부분만 닦으면 체온을 지키면서 깨끗하게 할 수 있어요.","bath":"적응 전 전신 목욕은 감기·스트레스의 원인이 될 수 있어요."}},{"id":"ev_potty_time","title":"배변은 타이밍이 반","text":"아기 강아지는 자고 일어났을 때, 밥 먹은 뒤, 신나게 논 뒤에 곧 배변을 해요. 바닥 냄새를 맡거나 빙글빙글 돌면 신호예요. 그때 패드로 데려가 성공하면 바로 칭찬해요.","why":{"pad":"신호를 보고 바로 데려가면 성공 경험이 쌓여요.","food":"신호를 놓치면 실수가 습관이 되기 쉬워요."}},{"id":"ev_accident","title":"실수에는 침착하게","text":"배변 실수를 혼내면 강아지는 \\"쉬를 하면 혼난다\\"로 배워서 숨어서 하게 돼요. 실수는 말없이 치우고 냄새(효소 탈취제)까지 없애요. 성공했을 때 바로 칭찬하는 게 가장 빨라요.","why":{"clean":"성공에 칭찬이 쌓이면 패드 = 좋은 곳이 돼요.","scold":"혼나면 배변 자체를 숨기게 돼 훈련이 더 어려워져요."}},{"id":"ev_crate_love","title":"집은 쉬는 곳","text":"하우스(작은 집)를 벌주는 곳으로 쓰지 않고, 간식·장난감·편한 담요와 함께 쓰면 강아지가 스스로 들어가 쉬는 안전한 자리가 돼요. 병원·여행·재난 때도 큰 도움이 돼요."},{"id":"ev_proof","title":"강아지 눈높이로 집 정리","text":"이가 나는 시기의 강아지는 무엇이든 씹어요. 전선·충전기·약·작은 장난감·양말·초콜릿은 물리기 전에 치우는 게 최선이에요. 물면 안 되는 걸 물었을 땐 혼내기보다 씹어도 되는 장난감과 바꿔 줘요.","why":{"swap":"바꿔 주기는 \\"이건 되고 저건 안 돼\\"를 가장 쉽게 알려 줘요.","yell":"쫓아가 빼앗으면 신나는 놀이가 되어 더 자주 물어요."}},{"id":"ev_toxic","title":"강아지에게 위험한 음식","text":"포도·건포도(신장), 초콜릿·카페인(심장·신경), 양파·마늘·파(빈혈), 자일리톨 껌·사탕(저혈당), 마카다미아, 익힌 뼈는 소량이라도 위험해요. 먹었다면 양과 시간을 확인해 바로 동물병원에 연락해요.","why":{"place":"조르기에 반응하지 않으면 식탁 매너가 자리 잡아요.","grape":"포도는 한 알로도 급성 신부전이 올 수 있어요.","treat":"간식이라도 조를 때 주면 조르기가 늘어요."}},{"id":"ev_zoomies","title":"우다다는 정상이에요","text":"갑자기 전력 질주하는 \\"우다다(줌이)\\"는 남은 에너지와 신나는 기분을 푸는 정상 행동이에요. 잠깐 지켜보고 부딪힐 물건만 치워 주세요. 미끄러운 바닥은 관절에 무리가 가니 매트를 깔면 좋아요.","why":{"watch":"스스로 진정하게 두면 흥분이 금방 가라앉아요.","chase":"쫓아가면 흥분이 더 커지고, 미끄러져 다칠 수 있어요."}},{"id":"ev_bite","title":"무는 힘 조절 배우기","text":"강아지는 형제와 놀며 \\"세게 물면 놀이가 끝난다\\"를 배워요. 사람도 세게 물리면 짧게 \\"아야!\\" 하고 잠깐 놀이를 멈추면 돼요. 손 대신 터그 장난감으로 놀아 주고, 때리는 벌은 사람 손을 무서워하게 만들어요.","why":{"ouch":"놀이가 멈추면 \\"세게 물면 재미없다\\"를 배워요.","hand":"손으로 놀아 주면 손을 무는 습관이 굳어요.","hit":"때리면 손을 겁내고 방어하려고 더 물 수 있어요."}},{"id":"ev_name_again","title":"이름은 언제나 좋은 신호","text":"혼낼 때 이름을 부르면 강아지는 이름을 \\"혼나는 신호\\"로 배워요. 이름을 다시 좋은 신호로 만들려면 한동안 이름을 부를 때마다 간식·칭찬·놀이만 주세요. 혼낼 일이 있으면 이름 대신 짧은 \\"아!\\" 소리를 써요.","why":{"restart":"이름 = 좋은 일을 다시 쌓으면 금방 회복돼요.","louder":"목소리가 커질수록 더 무서운 신호가 돼요."}},{"id":"ev_feed_again","title":"아기 강아지 밥 주기","text":"아기 강아지는 위가 작아서 하루 양을 3~4번에 나눠 줘야 해요. 사료 봉투의 \\"체중별 하루 양\\"을 저울로 재서 주고, 사람 음식은 주지 않아요. 토하거나 설사가 이어지면 병원에 가요.","why":{"split":"나눠 주면 소화가 편하고 혈당도 고르게 유지돼요.","same":"한 번에 많이 먹으면 토하거나 설사하기 쉬워요."}},{"id":"ev_out_early","title":"접종 전 외출","text":"기본 접종이 끝나기 전에는 다른 개·배설물과 닿으면 파보 같은 병에 걸릴 수 있어요. 그래도 안거나 가방에 넣고 바깥 소리·사람·차를 멀리서 보여 주면 사회화에 큰 도움이 돼요.","why":{"hold":"안전하게 거리를 두고 보는 것만으로도 세상을 배워요.","down":"접종 전 직접 접촉은 감염 위험이 있고, 큰 개는 무서울 수 있어요."}},{"id":"ev_weight","title":"체중은 건강 신호","text":"아기 강아지는 매주 체중을 재서 꾸준히 느는지 봐요. 사료 양도 체중에 맞춰 바꿔요. 갑자기 줄거나 늘지 않으면 기생충·질병 신호일 수 있어요. 병원에 자주 놀러 가서 간식을 받으면 병원을 덜 무서워해요."},{"id":"ev_night","title":"첫 주의 밤","text":"엄마·형제와 떨어진 아기 강아지가 밤에 우는 건 당연해요. 첫 1~2주는 잠자리를 사람 가까이 두고, 울면 조용히 곁에 있다는 것만 알려 주세요. 익숙해지면 조금씩 자리를 옮겨요. 우는 동안 꺼내 주면 \\"울면 나간다\\"를 배워요.","why":{"near":"가까이서 안심시키면 혼자 자는 법도 빨리 배워요.","pick":"울 때마다 꺼내 주면 우는 게 습관이 돼요.","ignore":"혼자 오래 울게 두면 불안이 커질 수 있어요."}},{"id":"tr_sit","title":"앉아는 간식으로 유도해요","text":"간식을 머리 위로 올리면 강아지는 고개를 들면서 저절로 앉아요. 앉는 순간 바로(1초 안에) 칭찬과 간식을 주는 게 핵심이에요. 엉덩이를 손으로 누르지 않아요."},{"id":"tr_paw","title":"손은 스스로 하게","text":"발을 억지로 잡지 않고, 강아지가 스스로 앞발을 올리게 기다려요. 몇 번 성공하면 간식 없이 손바닥만 보여 줘도 해요. 짧게 3~5번, 하루 몇 번이면 충분해요."},{"id":"tr_wait","title":"기다려는 아주 조금씩","text":"처음엔 1초, 한 걸음이면 충분해요. 시간과 거리를 한꺼번에 늘리지 말고 하나씩 늘려요. 실패하면 혼내지 말고 더 쉬운 단계로 돌아가요."},{"id":"tr_down","title":"엎드려는 간식을 바닥으로","text":"간식을 코앞에서 바닥으로, 그다음 앞으로 끌면 몸이 따라 엎드려요. 엎드려는 차분하게 기다리는 자세라서 흥분을 가라앉힐 때도 좋아요."},{"id":"tr_house","title":"하우스는 좋은 곳으로","text":"하우스(켄넬)는 벌주는 곳이 아니라 쉬는 곳이에요. 간식·장난감으로 스스로 들어가게 하고, 문 닫는 시간은 몇 초부터 아주 천천히 늘려요. 병원·이동·재난 때 큰 도움이 돼요."},{"id":"tr_leash","title":"당기면 멈추기","text":"리드가 팽팽해지면 멈추고, 느슨해지면 걷기. 이것만 꾸준히 해도 \\"당기면 못 간다\\"를 배워요. 옆에서 잘 걸을 때 자주 칭찬해 줘요."},{"id":"wk_cat","title":"흥분하면 멈추기","text":"고양이·새처럼 흥분할 것을 보면 멈춰 서서 기다리고, 대상 대신 보호자를 보면 칭찬해요. 줄을 세게 당기면 목에 무리가 가고, 산책이 무서운 일이 돼요."},{"id":"wk_bone","title":"\\"놓아\\"는 교환으로","text":"익힌 닭뼈는 날카롭게 쪼개져 위험해요. 입에 문 것을 억지로 빼면 지키려고 물 수 있어요. 평소에 \\"놓아\\" 하고 더 좋은 간식과 바꾸는 연습을 해 두면 위험할 때 써요."},{"id":"wk_noise","title":"큰 소리에 익숙해지기","text":"큰 소리에 놀랐을 때 보호자가 담담하면 강아지도 빨리 진정해요. 소리 뒤에 간식을 주면 \\"큰 소리 = 좋은 일\\"로 조금씩 바뀌어요."},{"id":"wk_greet","title":"강아지 인사 예절","text":"다른 강아지와 인사할 땐 보호자에게 먼저 묻고, 3초 정도 짧게 냄새를 맡게 한 뒤 헤어져요. 공원에서는 줄을 매는 것이 기본이에요."},{"id":"wk_far","title":"멀리서 보는 것도 공부","text":"접종이 끝나기 전에는 다른 개와 닿지 않게 하되, 멀리서 차분하게 보는 경험은 사회화에 큰 도움이 돼요."},{"id":"wk_kids","title":"아이와 만날 때","text":"아이에게 손을 낮게 내밀어 냄새를 맡게 하고, 한 명씩 등을 살살 쓰다듬게 알려 줘요. 강아지가 피하거나 꼬리를 말면 그만해요."},{"id":"wk_rain","title":"비 온 뒤에는 꼼꼼히 말리기","text":"젖은 털을 그대로 두면 피부병·귓병이 생기기 쉬워요. 특히 귀가 덮인 견종은 귀 안까지 잘 말려 줘요."},{"id":"wk_sniff","title":"냄새 맡기는 머리 운동","text":"냄새를 맡는 산책(노즈워크)은 강아지에게 큰 즐거움이고 스트레스를 풀어 줘요. 풀숲을 다녀온 뒤에는 진드기를 꼭 확인해요."},{"id":"wk_pigeon","title":"쫓기 대신 이름 부르기","text":"쫓아가는 것을 함께 하면 습관이 돼요. 흥분할 때 이름을 불러 돌아보면 칭찬하는 연습이 \\"이리 와\\"의 바탕이 돼요."},{"id":"wk_reactive","title":"무서울 땐 거리 두기","text":"짖는 개를 만나면 억지로 다가가지 말고 거리를 둬요. 거리가 멀어지면 강아지는 스스로 진정할 수 있어요."}]`),st=[{look:`golden`,breed:`골든 리트리버`,intro:`골든 리트리버는 순하고 똑똑하지만, 집안 내력처럼 잘 생기는 병이 몇 가지 있어요.`,conditions:[{name:`고관절·팔꿈치 이형성증`,what:`엉덩이와 팔꿈치 관절이 꼭 맞물리지 않게 자라는 병이에요. 크면서 관절이 닳아 아파요.`,sign:`일어날 때 힘들어하거나, 뒷다리를 절거나, 토끼처럼 두 다리를 모아 뛰어요.`,care:`살이 찌지 않게 하고, 어릴 때 높은 곳 점프나 계단 오르내리기를 줄여요. 엑스레이로 확인해요.`},{name:`암 (혈관육종·림프종)`,what:`골든 리트리버는 다른 견종보다 암이 잘 생기는 편이에요.`,sign:`몸에 혹이 만져지거나, 갑자기 기운이 없고 잇몸이 하얗게 보여요.`,care:`쓰다듬을 때 혹이 있는지 살피고, 7살이 넘으면 해마다 건강검진을 받아요.`},{name:`대동맥판 아래 협착 (심장)`,what:`심장에서 피가 나가는 길이 좁게 태어나는 병이에요.`,sign:`쉽게 지치거나, 운동하다 쓰러지기도 해요. 청진기로 심장 소리가 이상하게 들려요.`,care:`접종 때 심장 소리를 들어 보고, 이상하면 심장 초음파로 확인해요.`},{name:`포도막염 (눈)`,what:`눈 안쪽에 염증이 생기는 병이에요. 골든 리트리버에게 잘 생기는 종류가 따로 있어요.`,sign:`눈이 빨갛거나 눈을 자주 찡그리고 눈물이 많아요.`,care:`어른이 되면 해마다 눈 검사를 받아요. 늦게 알면 녹내장이 될 수 있어요.`},{name:`귀 염증·피부 알레르기`,what:`귀가 덮여 있어 습기가 차기 쉽고, 피부가 예민한 편이에요.`,sign:`귀에서 냄새가 나거나 머리를 자주 털고, 발을 계속 핥아요.`,care:`목욕이나 수영 뒤에는 귀를 잘 말려 줘요.`}]},{look:`black`,breed:`래브라도 리트리버`,intro:`래브라도 리트리버는 힘이 넘치고 먹는 걸 정말 좋아해요. 그래서 조심할 병도 있어요.`,conditions:[{name:`고관절·팔꿈치 이형성증`,what:`엉덩이와 팔꿈치 관절이 꼭 맞물리지 않게 자라는 병이에요.`,sign:`일어날 때 힘들어하거나, 산책하다 다리를 절어요.`,care:`살이 찌지 않게 하고, 어릴 때 무리한 점프를 줄여요. 엑스레이로 확인해요.`},{name:`비만`,what:`래브라도 중에는 배부름을 잘 못 느끼게 하는 유전자를 가진 아이가 많아요. 늘 배고파 보여요.`,sign:`갈비뼈가 손에 잘 안 만져지고 허리 잘록함이 없어져요.`,care:`사료는 저울로 재서 주고, 간식은 하루 먹는 양의 10%를 넘기지 않아요.`},{name:`운동하다 주저앉는 병 (EIC)`,what:`아주 신나게 뛰다 보면 뒷다리에 힘이 빠져 주저앉는 유전병이에요.`,sign:`격한 공놀이 몇 분 뒤 뒷다리가 휘청이며 주저앉아요. 쉬면 보통 돌아와요.`,care:`증상이 보이면 바로 쉬게 하고, 더운 날 격한 놀이는 피해요. 유전자 검사로 알 수 있어요.`},{name:`진행성 망막 위축 (눈)`,what:`눈 속 빛을 느끼는 부분이 조금씩 약해지는 유전병이에요.`,sign:`어두운 곳에서 잘 부딪히고, 밤 산책을 무서워해요.`,care:`유전자 검사와 눈 검사로 미리 알 수 있어요. 집 안 가구 배치를 자주 바꾸지 않아요.`}]},{
