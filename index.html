"action.pet.hint":`손길로 안심시켜요`,"place.park":`햇살 공원`,"place.clinic":`동물병원`,"quest.kind.main":`메인`,"quest.kind.daily":`오늘`,"quest.kind.weekly":`이번 주`,"quest.m01_welcome.title":`우리 집에 온 걸 환영해`,"quest.m01_welcome.desc":`낯선 집에 온 첫날. 천천히 다가가 쓰다듬어 주고, 밥을 챙겨 주세요.`,"quest.m01_welcome.pet":`강아지 쓰다듬기`,"quest.m01_welcome.feed":`밥그릇에 밥 주기`,"quest.m02_potty.title":`배변 패드 알려주기`,"quest.m02_potty.desc":`밥을 먹고 나면 곧 신호가 와요. 강아지가 패드 근처를 킁킁거리면 패드로 데려가세요.`,"quest.m02_potty.ok":`패드에서 배변 성공`,"quest.m03_crate.title":`크레이트는 편한 곳`,"quest.m03_crate.desc":`혼자 있는 연습은 짧게, 자주. 크레이트가 벌 받는 곳이 아니라 쉬는 곳이 되게 해 주세요.`,"quest.m03_crate.crate":`크레이트에서 쉬게 하기`,"quest.m04_name.title":`이름을 불러 봐요`,"quest.m04_name.desc":`훈련 매트에서 짧게 훈련해요. 타이밍 좋게 칭찬하면 더 빨리 배워요.`,"quest.m04_name.train":`훈련하기`,"quest.m04_name.great":`훈련 '훌륭해요' 받기`,"quest.m05_world.title":`바깥 세상 냄새`,"quest.m05_world.desc":`접종이 끝나기 전에는 안고 나가 바깥 소리와 냄새에 익숙해지게 해요. 동네 동물병원 위치도 알아 두세요.`,"quest.m05_world.out":`공원 벤치까지 외출하기`,"quest.m05_world.clinic":`동물병원 앞에 가 보기`,"quest.m06_vaccine.title":`예방접종 마치기`,"quest.m06_vaccine.desc":`종합백신은 3~4주 간격으로 여러 번 맞아요. 병원 안내가 오면 미루지 말고 접종해 주세요.`,"quest.m06_vaccine.shots":`종합백신 접종`,"quest.m07_leash.title":`리드줄 산책 데뷔`,"quest.m07_leash.desc":`접종이 끝났어요! 이제 리드줄을 하고 직접 걸어서 공원까지 가 봐요.`,"quest.m07_leash.walk":`리드줄 산책으로 공원 가기`,"quest.d_feed.title":`밥 세 번`,"quest.d_feed.desc":`어린 강아지는 하루 3~4번 나눠 먹어요.`,"quest.d_feed.feed":`밥 주기`,"quest.d_potty.title":`배변 성공`,"quest.d_potty.desc":`신호를 보고 패드로 데려가요.`,"quest.d_potty.ok":`패드에서 배변`,"quest.d_pet.title":`스킨십`,"quest.d_pet.desc":`하루에 몇 번씩 다정하게 쓰다듬어 주세요.`,"quest.d_pet.pet":`쓰다듬기`,"quest.d_out.title":`바깥 구경`,"quest.d_out.desc":`하루 한 번은 바깥 공기를 맡게 해 주세요.`,"quest.d_out.out":`공원 벤치까지 외출`,"quest.w_train.title":`꾸준한 훈련`,"quest.w_train.desc":`이번 주에 '훌륭해요' 훈련 3번.`,"quest.w_train.great":`훈련 '훌륭해요'`,"quest.w_out.title":`동네 단골`,"quest.w_out.desc":`이번 주에 외출 5번.`,"quest.w_out.out":`외출하기`,"quest.w_alone.title":`혼자서도 괜찮아`,"quest.w_alone.desc":`이번 주에 크레이트 연습 3번.`,"quest.w_alone.crate":`크레이트 연습`,"action.parttime":`카페 아르바이트를 했어요`,"action.parttime.hint":`돈을 벌지만 강아지는 혼자 기다려요`,"item.kibble":`퍼피 사료`,"item.kibble.desc":`어린 강아지용 사료 1회분. 밥 주기를 할 때마다 1개씩 써요.`,"item.kibble.how":`펫샵에서 사거나, 퀘스트·출석 체크 보상으로 받아요.`,"item.treat":`훈련 간식`,"item.treat.desc":`작게 잘라 주는 보상용 간식. 하루 3번까지.`,"item.treat.how":`펫샵에서 사거나 퀘스트 보상으로 받아요.`,"item.dental_chew":`덴탈껌`,"item.dental_chew.desc":`씹으면서 이를 닦아요. 하루 1개.`,"item.dental_chew.how":`펫샵에서 사거나 출석 체크 보상으로 받아요.`,"item.tug_toy":`터그 장난감`,"item.tug_toy.desc":`당기기 놀이용 밧줄 장난감. 써도 없어지지 않아요(하루 2번).`,"item.tug_toy.how":`펫샵에서 살 수 있어요.`,"item.nutrient":`영양제`,"item.nutrient.desc":`하루 한 알. 건강을 조금씩 챙겨요.`,"item.nutrient.how":`펫샵에서 사거나 출석 체크 보상으로 받아요.`,"item.cat.food":`사료`,"item.cat.treat":`간식`,"item.cat.toy":`장난감`,"item.cat.health":`건강`,"shop.petshop":`펫샵`,"shop.kibble_s":`퍼피 사료 소포장`,"shop.kibble_l":`퍼피 사료 대포장`,"shop.treat_pack":`훈련 간식 한 봉지`,"shop.dental_pack":`덴탈껌 한 팩`,"shop.tug_toy":`터그 장난감`,"shop.nutrient_pack":`영양제 한 통`,"stat.money":`돈`,"action.greet_dog":`공원에서 다른 강아지를 만났어요`,"action.greet_dog.hint":`접종이 끝나면 인사, 그 전엔 멀리서 지켜보기`,"place.petshop":`펫샵`,"quest.m08_friend.title":`공원 친구 사귀기`,"quest.m08_friend.desc":`햇살 공원에서 다른 강아지와 인사해 봐요. 서로 냄새를 맡게 하고, 긴장하면 거리를 두세요.`,"quest.m08_friend.greet":`친구 강아지와 인사하기`,"ach.first_friend.title":`첫 강아지 친구`,"ach.first_friend.text":`공원에서 처음으로 다른 강아지와 코 인사를 했어요.`,"tip.1":`산책 전에는 목줄과 배변봉투를 꼭 챙기렴.`,"tip.2":`다른 강아지를 만나면 먼저 보호자에게 인사해도 되는지 물어보는 게 예의란다.`,"tip.3":`여름엔 아스팔트가 뜨거워서 발바닥을 데일 수 있어. 손등으로 먼저 만져 보렴.`,"tip.4":`강아지가 하품하거나 고개를 돌리면 긴장했다는 신호야. 잠깐 쉬어 가렴.`,"tip.5":`어릴 때 여러 소리와 사람을 차분히 만나게 해 주면 겁 많은 개가 되지 않아.`,"tip.6":`포도, 초콜릿, 양파는 강아지에게 위험하단다. 사람 음식은 주지 마렴.`,"clinic.reception":`예방접종은 일정이 되면 안내 문자가 가요. 아픈 곳이 있으면 언제든 오세요!`,"ev.3-01.title":`어른이 되어 가요`,"ev.3-01.text":`요즘 들어 행동이 달라졌어요. 다리를 들고 여기저기 냄새를 묻히거나, 쿠션에 올라타기도 해요. 몸이 어른이 되어 가는 신호예요.`,"ev.3-02.title":`중성화, 어떻게 할까?`,"ev.3-02.text":`수의사 선생님과 중성화 상담을 했어요. 수술 비용은 25만 원 정도이고, 시기는 아이의 성장과 건강을 보고 정하는 게 좋대요.`,"choice.3-02.now":`지금 하기로 한다 (25만 원)`,"choice.3-02.later":`조금 더 커서 다시 상담한다`,"choice.3-02.never":`하지 않기로 한다`,"ev.3-03.title":`중성화 수술과 회복`,"ev.3-03.text":`수술은 잘 끝났어요. 이제 일주일 넘게 상처가 아물 때까지 지켜봐야 해요. 넥카라를 답답해하는데 어떻게 할까요?`,"choice.3-03.rest":`넥카라를 씌우고 산책은 잠깐 쉰다`,"choice.3-03.walk":`답답해 보여서 넥카라를 빼고 산책을 나간다`,"ev.3-04.title":`사라진 슬리퍼`,"ev.3-04.text":`외출하고 돌아오니 슬리퍼 한 짝이 너덜너덜해졌고, 소파 다리에도 이빨 자국이 생겼어요.`,"choice.3-04.redirect":`씹어도 되는 장난감을 주고 물건은 치워 둔다`,"choice.3-04.ignore":`그냥 내버려 둔다`,"choice.3-04.scold":`현장을 보여 주며 크게 혼낸다`,"ev.3-05.title":`앞으로! 앞으로!`,"ev.3-05.text":`산책 중에 고양이를 보더니 줄을 세게 당기며 앞으로 달려 나가려고 해요. 팔이 빠질 것 같아요.`,"choice.3-05.stop_wait":`멈춰 서서 줄이 느슨해질 때까지 기다린다`,"choice.3-05.follow":`끌려가듯 따라간다`,"choice.3-05.jerk":`줄을 세게 잡아챈다`,"ev.3-06.title":`갑자기 무서워요`,"ev.3-06.text":`매일 지나던 길의 쓰레기통 앞에서 갑자기 짖으며 뒷걸음질 쳐요. 전에는 아무렇지 않았는데요.`,"choice.3-06.calm":`거리를 두고 간식을 주며 천천히 지나간다`,"choice.3-06.ignore":`모른 척하고 그냥 지나간다`,"choice.3-06.force":`괜찮다며 쓰레기통 앞으로 끌고 간다`,"ev.3-07.title":`혼자 있는 게 힘들어요`,"ev.3-07.text":`이웃이 낮에 강아지가 오래 짖었다고 알려 줬어요. 현관문 앞에는 긁힌 자국이 생겼어요.`,"choice.3-07.train":`짧게 나갔다 오는 연습부터 다시 시작한다`,"choice.3-07.ignore":`크면 괜찮아지겠지 하고 둔다`,"ev.3-08.title":`이건 좀 민망한데…`,"ev.3-08.text":`손님이 왔는데 손님 다리에 매달려 마운팅을 해요. 다들 웃었지만 조금 당황스러워요.`,"choice.3-08.stop":`차분히 떼어 내고 '앉아'를 시킨다`,"choice.3-08.let":`귀엽다며 그냥 둔다`,"ev.3-09.title":`여기도 내 거, 저기도 내 거`,"ev.3-09.text":`산책할 때마다 전봇대, 화단, 가게 앞까지 다리를 들고 소변을 조금씩 묻혀요.`,"choice.3-09.stop":`줄을 짧게 잡고 지나가고, 묻힌 곳은 물로 씻는다`,"choice.3-09.allow":`원하는 대로 하게 둔다`,"ev.3-13.title":`정말 감당할 수 있을까`,"ev.3-13.text":`물어뜯고, 짖고, 당기고… 요즘은 하루하루가 버거워요. 밤에 잠든 강아지를 보며 생각이 많아져요.`,"choice.3-13.doubt":`너무 힘들어서 포기까지 생각해 본다`,"choice.3-13.resolve":`이 시기는 지나간다고 믿고 다시 마음을 다잡는다`,"ev.3-14.title":`개춘기 결산`,"ev.3-14.text":`두 살이 되었어요! 폭풍 같던 개춘기를 함께 지나왔어요.`,"learn.puberty":`생후 6개월 무렵부터 몸이 어른이 되어 가요. 암컷은 첫 발정(출혈, 외음부 부기)이 오고, 수컷은 다리를 들고 마킹하거나 마운팅이 늘 수 있어요. 골든 리트리버 같은 대형견은 다 자라기까지 1년 넘게 걸리기도 해요.`,"learn.neuter":`중성화는 원치 않는 임신을 막고, 암컷의 자궁축농증·유선종양, 수컷의 전립선 질환 위험을 줄여요. 다만 대형견은 너무 이른 중성화가 관절 질환 위험을 높일 수 있다는 연구도 있어서, 시기는 꼭 수의사와 상의해서 정해요.`,"learn.neuter_recovery":`수술 뒤 7~10일은 상처를 핥지 않게 넥카라를 씌우고, 뛰거나 목욕하는 것을 피해요. 상처가 붓거나 진물이 나면 바로 병원에 가요. 회복하는 동안은 산책과 공놀이를 쉬어요.`,"learn.chewing_teen":`개춘기의 물어뜯기는 에너지가 남거나 지루할 때 심해져요. 혼내기보다 씹어도 되는 장난감을 주고, 산책·공놀이·노즈워크로 에너지를 풀어 주는 게 효과적이에요. 망가지면 안 되는 물건은 미리 치워 두세요.`,"learn.leash_pulling":`줄을 당길 때 따라가면 '당기면 원하는 곳에 간다'를 배워요. 줄이 팽팽해지면 멈추고, 느슨해지면 다시 걷기를 반복해 주세요. 줄을 세게 잡아채면 목과 기관지를 다칠 수 있어요.`,"learn.fear_period":`생후 6~14개월 무렵 갑자기 겁이 많아지는 '2차 공포기'가 올 수 있어요. 억지로 다가가게 하면 공포가 오래 남을 수 있어요. 거리를 두고, 간식으로 좋은 기억을 만들어 주며 천천히 익숙해지게 해요.`,"learn.separation_teen":`혼자 있을 때 오래 짖거나 문을 긁으면 분리불안 신호일 수 있어요. 아주 짧게 나갔다 오는 연습부터 시작해 시간을 조금씩 늘리고, 나갈 때·돌아올 때 요란하게 인사하지 않는 게 좋아요. 심하면 수의사와 상담해요.`,"learn.mounting":`마운팅은 성적 행동만이 아니라 흥분·놀이·스트레스 때문에도 나와요. 혼내기보다 차분히 떼어 내고 '앉아' 같은 다른 행동으로 바꿔 주세요. 다른 개에게 하면 싸움이 날 수 있어 제지해요.`,"learn.marking":`산책 중 여기저기 소변을 묻히는 건 영역 표시예요. 남의 집·가게 앞에서는 줄을 짧게 잡고 지나가고, 묻힌 곳은 물로 씻어 주는 게 예의예요. 중성화를 하면 줄어드는 경우가 많아요.`,"learn.hard_times":`개춘기는 많은 보호자가 가장 힘들어하는 시기예요. 그래도 대부분 두 살 무렵이면 차분해져요. 혼자 버티기 어렵다면 반려견 행동 전문가나 수의 행동 클리닉에 도움을 청할 수 있어요. 힘들다고 느끼는 건 잘못이 아니에요.`,"learn.teen_summary":`두 살이 되었어요! 개춘기에 쌓은 훈련과 신뢰는 앞으로 함께할 성견 생활의 바탕이 돼요.`,"action.exercise":`공원에서 신나게 공놀이를 했어요`,"action.exercise.hint":`에너지를 풀어 줘요. 어린 강아지는 관절을 위해 짧게`,"quest.c3_m01_vet.title":`중성화 상담받기`,"quest.c3_m01_vet.desc":`몸이 어른이 되어 가요. 동물병원에서 수의사 선생님과 상담하고 중성화를 어떻게 할지 정해요.`,"quest.c3_m01_vet.visit":`동물병원 가기`,"quest.c3_m01_vet.decide":`중성화 여부 정하기`,"quest.c3_m02_energy.title":`넘치는 에너지`,"quest.c3_m02_energy.desc":`남는 에너지는 물어뜯기로 이어지기 쉬워요. 공원에서 공놀이로 마음껏 뛰게 해 주세요.`,"quest.c3_m02_energy.play":`공원에서 공놀이`,"quest.c3_m03_leash.title":`줄 당기지 않고 걷기`,"quest.c3_m03_leash.desc":`힘이 세져서 줄을 당기면 감당하기 어려워요. 꾸준한 산책과 훈련으로 나란히 걷는 법을 익혀요.`,"quest.c3_m03_leash.walk":`리드줄 산책`,"quest.c3_m03_leash.great":`훈련 '훌륭해요'`,"quest.c3_m04_social.title":`친구는 계속 만나야 해요`,"quest.c3_m04_social.desc":`사회화는 어릴 때 한 번으로 끝나지 않아요. 공원 친구들과 꾸준히 인사해요.`,"quest.c3_m04_social.greet":`친구 강아지와 인사`,"quest.c3_m05_alone.title":`혼자서도 차분하게`,"quest.c3_m05_alone.desc":`개춘기에는 분리불안이 심해지기 쉬워요. 하우스에서 쉬는 연습을 이어 가요.`,"quest.c3_m05_alone.crate":`하우스에서 쉬기`,"quest.c3_m05_alone.calm":`분리불안 20 이하로`,"quest.c3_m06_grown.title":`의젓한 어른 개`,"quest.c3_m06_grown.desc":`훈련은 몸에 배고, 문제 행동은 줄어들었어요. 개춘기 졸업이 눈앞이에요.`,"quest.c3_m06_grown.training":`훈련도 70 이상`,"quest.c3_m06_grown.risk":`문제행동 가능성 30 이하`,"quest.w3_exercise.title":`이번 주 운동`,"quest.w3_exercise.desc":`일주일에 한 번은 공원에서 마음껏 뛰어요.`,"quest.w3_exercise.play":`공원에서 공놀이`,"ach.teen_start.title":`개춘기 시작`,"ach.teen_start.text":`어느새 몸도 마음도 어른이 되어 가요.`,"ach.neutered.title":`수술을 잘 견뎠어요`,"ach.neutered.text":`중성화 수술을 무사히 마쳤어요. 넥카라도 잘 참았어요.`,"ach.big_dog.title":`이제 안을 수 없어요`,"ach.big_dog.text":`몸무게가 25kg을 넘었어요. 안고 다니던 시절이 그리워요.`,"ach.teen_graduate.title":`개춘기 졸업`,"ach.teen_graduate.text":`두 살이 되었어요. 폭풍 같은 시기를 함께 지나왔어요.`,"chapter.ch2":`2장 · 퍼피기`,"chapter.ch3":`3장 · 개춘기`,"chapter.ch2.desc":`생후 8주 ~ 6개월`,"chapter.ch3.desc":`생후 6개월 ~ 2살 · 하루가 지나면 일주일이 흘러요`},W={stats:Le,actions:Oe,events:[...Fe,...Ie],balance:ke,achievements:De,quests:je,places:Ae,items:Ne,shops:Pe,attendance:Me,texts:Re},ze=e=>Math.round(e*1e3)/1e3;function Be(e,t){if(t===`age`)return e.age;if(t===`money`)return e.money;let n=t.indexOf(`:`),r=t.slice(0,n),i=t.slice(n+1),a=r===`stat`?e.stats:r===`counter`?e.counters:r===`var`?e.vars:r===`item`?e.inventory??{}:void 0;if(!a)throw Error(`unknown ref: ${t}`);return a[i]??0}function Ve(e,t,n){switch(t){case`<`:return e<n;case`<=`:return e<=n;case`>`:return e>n;case`>=`:return e>=n;case`==`:return e===n;case`!=`:return e!==n;default:throw Error(`unknown op: ${t}`)}}function He(e,t){if(`ref`in t){let n=t.ref2===void 0?t.value:Be(e,t.ref2);if(n===void 0)throw Error(`cond needs value or ref2: ${JSON.stringify(t)}`);return Ve(Be(e,t.ref),t.op,n)}return`flag`in t?e.flags.includes(t.flag):`not_flag`in t?!e.flags.includes(t.not_flag):`done`in t?(e.eventLog[t.done]?.count??0)>0:`quest_done`in t?(e.quests?.log[t.quest_done]?.count??0)>0:(e.eventLog[t.not_done]?.count??0)===0}function Ue(e,t){return(t??[]).every(t=>He(e,t))}function We(e,t,n){let r=/^=@age([+-]\d+)$/.exec(t);if(r)return n+Number(r[1]);let i=/^([+\- 을 대신 주세요."},{"id":"vaccine","title":"예방접종 일정","text":"생후 6~8주부터 2~4주 간격으로 종합백신을 맞아요. 접종이 끝나기 전에는 다른 강아지가 많은 곳은 피하는 게 좋아요.","cost":"첫 진료 + 접종 약 3~6만 원"},{"id":"name","title":"이름은 좋은 일과 함께","text":"이름을 부르고 다가오면 간식과 칭찬을 줘요. 혼낼 때 이름을 부르면 이름이 싫은 말이 될 수 있어요."},{"id":"brush","title":"빗질은 짧고 즐겁게","text":"어릴 때부터 짧게 자주 빗질해 주면 몸을 만지는 걸 좋아하게 돼요. 골든 리트리버는 털이 많이 빠져서 빗질이 특히 중요해요."},{"id":"leash","title":"목줄은 천천히","text":"처음엔 집 안에서 잠깐씩 목줄을 하고 간식을 줘요. 익숙해지면 줄을 달고 집 안을 함께 걸어 봐요."},{"id":"vaccine_start","title":"종합백신은 6~8주부터","text":"종합백신은 생후 6~8주쯤 시작해서 2~4주 간격으로 여러 번 맞아요. 접종이 끝나기 전에는 다른 강아지가 많은 곳은 피해요.","why":{"go":"정해진 날짜에 맞춰야 면역이 제대로 생겨요.","postpone":"조금 늦는 건 괜찮지만, 그동안 감염 위험이 커져요. 다시 날짜를 꼭 잡아요."},"cost":"종합백신 1회 약 3~5만 원 (병원마다 달라요)"},{"id":"potty_accident","title":"실수에는 침착하게","text":"실수했을 때 혼내면 \\"보호자 앞에서 싸면 혼난다\\"고 배워서 숨어서 싸게 돼요. 조용히 치우고, 성공했을 때 바로 칭찬하는 게 배변 훈련의 기본이에요.","why":{"angry":"혼내면 배변 자체를 숨기게 되고 신뢰가 떨어져요.","calm":"타이밍 맞추기 + 성공하면 바로 칭찬이 가장 빠른 방법이에요."}},{"id":"chewing","title":"이가 날 때는 씹고 싶어요","text":"생후 3~6개월은 이갈이 시기라 뭐든 씹고 싶어 해요. 혼내기보다 씹어도 되는 장난감으로 바꿔 주세요.","why":{"redirect":"하고 싶은 행동(씹기)을 괜찮은 물건으로 바꿔 주는 게 핵심이에요.","ignore":"그냥 두면 신발·가구도 씹어도 된다고 배워요.","scold":"이갈이는 자연스러운 일이라, 혼나면 이유를 모른 채 겁만 먹어요."}},{"id":"deworm","title":"구충제는 정해진 주기에","text":"기생충은 눈에 보이지 않아도 설사·체중 감소를 일으킬 수 있어요. 수의사가 정해 준 주기에 맞춰 꾸준히 먹여요.","why":{"give":"주기를 지키는 게 가장 중요해요.","skip":"한 번쯤 늦어도 되지만, 잊지 않게 날짜를 다시 정해요."},"cost":"구충제 1회 약 5천~1만 원"},{"id":"mouthing","title":"무는 힘 조절 배우기","text":"어린 강아지는 놀면서 \\"얼마나 세게 물면 아픈지\\"를 배워요. 세게 물면 놀이를 잠깐 멈춰서 알려 주세요.","why":{"play_on":"계속 놀아 주면 손을 세게 물어도 된다고 배워요.","stop_firmly":"놀이가 멈추는 게 강아지에게는 가장 확실한 신호예요."}},{"id":"vaccine_schedule","title":"접종은 끝까지","text":"종합백신은 보통 3~5번에 걸쳐 맞아요. 마지막 접종 뒤 2주쯤 지나야 면역이 충분히 생겨요.","why":{"go":"끝까지 맞혀야 파보·홍역 같은 위험한 병을 막을 수 있어요.","postpone":"미룰수록 위험한 시기가 길어져요."}},{"id":"wary_reaction","title":"겁이 날 땐 거리 두기","text":"억지로 무서운 대상 앞에 데려가면 공포가 더 커져요. 강아지가 편안한 거리에서 간식과 함께 좋은 기억을 만들어 줘요.","why":{"approach":"억지로 다가가게 하면 무서운 기억만 남아요.","distance":"편안한 거리에서 시작하는 게 사회화의 기본이에요."}},{"id":"rabies","title":"광견병 접종은 꼭","text":"광견병은 사람에게도 옮을 수 있는 병이라 생후 3개월쯤 꼭 맞히고, 그 뒤로 해마다 맞혀요.","why":{"go":"법으로도 권장되는 중요한 접종이에요.","postpone":"광견병은 걸리면 치료가 어려워요. 꼭 날짜를 잡아요."},"cost":"광견병 접종 약 1~3만 원 (지역 보건소 할인 행사도 있어요)"},{"id":"separation_early","title":"나갈 때는 차분하게","text":"나갈 때 오래 달래 주면 \\"보호자가 나가는 건 큰일\\"이라고 배워요. 장난감을 주고 담담하게 나갔다 오는 연습을 해요.","why":{"comfort":"요란한 인사는 오히려 불안을 키워요.","leave_calmly":"짧고 차분한 외출이 혼자 있는 연습이 돼요."}},{"id":"puppy_summary","title":"퍼피기는 평생의 바탕","text":"생후 6개월까지의 경험이 앞으로의 성격과 행동에 큰 영향을 줘요. 이 시기에 쌓은 신뢰와 습관이 개춘기를 버티는 힘이 돼요."},{"id":"puberty","title":"몸이 어른이 되어 가요","text":"생후 6개월쯤부터 암컷은 첫 발정이 오고, 수컷은 다리를 들고 마킹하거나 마운팅이 늘 수 있어요. 골든 리트리버 같은 대형견은 다 자라기까지 1년 넘게 걸려요."},{"id":"neuter","title":"중성화는 수의사와 함께 정해요","text":"중성화는 원치 않는 임신을 막고, 암컷의 자궁축농증·유선종양, 수컷의 전립선 질환 위험을 줄여요. 대형견은 너무 이른 중성화가 관절 질환 위험을 높일 수 있다는 연구도 있어서 시기는 수의사와 상의해요.","why":{"now":"건강 상태를 확인하고 정했다면 좋은 선택이에요.","later":"대형견은 성장을 보고 정하는 것도 좋은 방법이에요.","never":"하지 않는 것도 보호자의 선택이에요. 대신 발정기 관리와 정기 검진이 더 중요해져요."},"cost":"중성화 수술 약 20~40만 원 (크기·성별·병원에 따라 달라요)"},{"id":"neuter_recovery","title":"수술 뒤 7~10일","text":"상처를 핥지 않게 넥카라를 씌우고, 뛰거나 목욕하는 건 피해요. 상처가 붓거나 진물이 나면 바로 병원에 가요.","why":{"rest":"답답해도 넥카라와 휴식이 가장 빠른 회복 방법이에요.","walk":"상처를 핥거나 뛰면 염증이 생겨 회복이 더 늦어져요."}},{"id":"chewing_teen","title":"지루하면 더 씹어요","text":"개춘기의 물어뜯기는 에너지가 남거나 지루할 때 심해져요. 산책·공놀이·노즈워크로 에너지를 풀어 주고, 망가지면 안 되는 물건은 미리 치워요.","why":{"redirect":"환경을 바꾸고 대신할 거리를 주는 게 가장 효과적이에요.","ignore":"그냥 두면 씹는 습관이 굳어요.","scold":"강아지는 몇 분 전 일과 혼나는 걸 연결하지 못해요."}},{"id":"leash_pulling","title":"당기면 멈추기","text":"줄을 당길 때 따라가면 \\"당기면 원하는 곳에 간다\\"를 배워요. 줄이 팽팽해지면 멈추고, 느슨해지면 다시 걷기를 반복해요.","why":{"stop_wait":"멈춤 → 느슨해지면 출발, 이걸 반복하는 게 정답이에요.","follow":"따라가면 당기는 행동이 보상을 받아요.","jerk":"줄을 세게 잡아채면 목과 기관지를 다칠 수 있어요."}},{"id":"fear_period","title":"2차 공포기","text":"생후 6~14개월쯤 갑자기 겁이 많아지는 시기가 올 수 있어요. 억지로 다가가게 하면 공포가 오래 남아요. 거리를 두고 간식으로 좋은 기억을 만들어 줘요.","why":{"calm":"거리 + 간식 + 천천히, 공포를 줄이는 기본 방법이에요.","ignore":"지나가는 건 괜찮지만, 좋은 기억을 만들어 주면 더 빨리 나아져요.","force":"억지로 마주하게 하면 공포가 더 깊어져요."}},{"id":"separation_teen","title":"분리불안 신호","text":"혼자 있을 때 오래 짖거나 문을 긁으면 분리불안 신호일 수 있어요. 아주 짧게 나갔다 오는 연습부터 시작해 시간을 늘리고, 심하면 수의사와 상담해요.","why":{"train":"짧은 시간부터 늘려 가는 게 가장 확실한 방법이에요.","ignore":"분리불안은 저절로 나아지기보다 심해지는 경우가 많아요."}},{"id":"mounting","title":"마운팅은 흥분 신호이기도 해요","text":"마운팅은 성적 행동만이 아니라 흥분·놀이·스트레스 때문에도 나와요. 혼내기보다 차분히 떼어 내고 \\"앉아\\" 같은 다른 행동으로 바꿔 줘요.","why":{"stop":"다른 행동으로 바꿔 주는 게 가장 좋아요.","let":"다른 개에게 하면 싸움이 날 수도 있어요."}},{"id":"marking","title":"산책 예절","text":"여기저기 소변을 묻히는 건 영역 표시예요. 남의 집·가게 앞에서는 줄을 짧게 잡고 지나가고, 묻힌 곳은 물로 씻어 주는 게 예의예요.","why":{"stop":"이웃과 함께 사는 예절이에요.","allow":"마킹을 그냥 두면 습관이 되고 이웃에게 피해가 갈 수 있어요."}},{"id":"hard_times","title":"힘든 건 잘못이 아니에요","text":"개춘기는 많은 보호자가 가장 힘들어하는 시기예요. 대부분 두 살 무렵이면 차분해져요. 혼자 버티기 어렵다면 반려견 행동 전문가나 수의 행동 클리닉에 도움을 청해요.","why":{"help":"도움을 청하는 건 책임감 있는 선택이에요.","resolve":"마음을 다잡는 것도 좋아요. 그래도 힘들 땐 언제든 도움을 청해요."}},{"id":"teen_summary","title":"이제 어른 강아지","text":"개춘기에 쌓은 훈련과 신뢰는 앞으로 함께할 성견 생활의 바탕이 돼요. 1년에 한 번은 건강 검진을 받아요."}]`),q={balance:un,chapters:dn,tasks:fn,shop:pn,attendance:mn},gn=hn,_n=gn.length>0;function vn(e){return e&&gn.find(t=>t.id===e)||null}function yn(e,t){let n=e.balance.grades.reduce((e,t)=>e+t.odds,0),r=t.next()*n,i=e.balance.grades[0].id;for(let t of e.balance.grades){if(r<t.odds){i=t.id;break}r-=t.odds}let a=e.balance.looks;return{grade:i,look:a[Math.floor(t.next()*a.length)]}}function bn(e,t,n){let{look:r,grade:i}=yn(e,new yt(t>>>0));return{version:1,pet:{name:n,look:r,grade:i},stars:e.balance.start.stars,bones:e.balance.start.bones,hearts:e.balance.hearts.max,heartAt:0,best:{},tasks:[],choices:{},stats:Sn(e),decor:[],snacks:0,attendance:{last:null,streak:0,total:0},settings:{edu:!0}}}var xn=50;function Sn(e){return Object.fromEntries(e.balance.stats.map(e=>[e.id,xn]))}function Cn(e,t){return t.choices&&t.stats?t:{...t,choices:t.choices??{},stats:{...Sn(e),...t.stats??{}}}}function wn(e,t){return e.balance.grades.find(e=>e.id===t)??e.balance.grades[0]}function Tn(e,t
