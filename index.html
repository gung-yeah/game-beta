요." 미리 챙기길 잘했어요!`,stats:{trust:1}},{id:`none`,label:`"그런 게 필요해요?" 하고 당황한다`,good:!1,result:`고속열차는 반려동물 예방접종 여부를 확인할 수 있어요. 집을 나서기 전에 꼭 챙겨요.`}]},{id:`train2`,scene:`🚄💺`,text:`한 시간 넘게 달리는 동안 {name}가 답답해 보여요.`,choices:[{id:`aisle`,label:`통로에 잠깐 꺼내 걷게 한다`,good:!1,result:`열차 안에서는 이동장 밖으로 꺼낼 수 없어요. 통로는 다른 승객이 다니는 길이에요.`},{id:`stop`,label:`이동장 안에서 물을 조금 주고, 내려서 걷게 한다`,good:!0,result:`도착역 밖 화단에서 실컷 냄새를 맡고 배변도 했어요. 봉투로 깨끗이!`,stats:{calm:1,trust:1}}]}]},{id:`car`,note:`뒷좌석에 단단히 고정해요`,icon:`🚗`,name:`자가용`,edu:`tp_car`,steps:[{id:`car1`,scene:`🚗💺`,text:`차에 탈 차례예요. {name}를 어디에 태울까요?`,choices:[{id:`lap`,label:`운전하는 사람 무릎에 앉힌다`,good:!1,result:`동물을 안고 운전하면 도로교통법 위반이에요(승용차 범칙금 4만 원). 핸들을 건드리면 큰 사고가 나요.`},{id:`front`,label:`조수석에 그냥 앉힌다`,good:!1,result:`급정거 때 앞으로 튕겨 나가고, 에어백이 터지면 크게 다칠 수 있어요.`},{id:`back`,label:`뒷좌석에 이동장·카시트를 벨트로 고정한다`,good:!0,result:`단단히 고정했어요. 급정거에도 {name}가 안전해요.`,stats:{trust:2}}]},{id:`car2`,scene:`🚗🌬️`,text:`{name}가 창문 밖 바람 냄새가 좋은지 코를 킁킁거려요.`,choices:[{id:`head`,label:`창문을 내려 고개를 내밀게 한다`,good:!1,result:`고개를 내밀면 눈에 먼지·벌레가 들어가고, 뛰어내리는 사고도 나요. 창문은 살짝만 열어요.`},{id:`crack`,label:`창문은 손가락 하나만큼만 열고 에어컨으로 시원하게`,good:!0,result:`시원한 바람에 {name}가 꾸벅꾸벅 졸아요.`}]},{id:`car3`,scene:`🅿️☀️`,text:`휴게소에 들렀어요. 화장실이 급해요!`,choices:[{id:`leave`,label:`창문을 조금 열고 {name}만 차에 두고 다녀온다`,good:!1,result:`햇볕 아래 차 안은 몇 분 만에 매우 뜨거워져 열사병이 와요. 겨울엔 반대로 추워요. 혼자 두지 않아요.`},{id:`together`,label:`가족이 번갈아 {name}와 반려견 쉼터에서 기다린다`,good:!0,result:`반려견 쉼터에서 물도 마시고 배변도 했어요. 봉투로 치우고 다시 출발!`,stats:{health:1,trust:1}}]}]},{id:`pettaxi`,note:`큰 개도 탈 수 있어요 · 미리 예약`,icon:`🚐`,name:`펫택시`,edu:`tp_pettaxi`,steps:[{id:`pt1`,scene:`📱🚐`,text:`반려동물 전용 택시를 예약해요. 무엇을 알려 줄까요?`,choices:[{id:`size`,label:`견종·몸무게·멀미 여부를 미리 알린다`,good:!0,result:`큰 차와 넓은 이동장을 준비해 주셨어요. 대형견은 미리 알리는 게 서로 편해요.`,stats:{trust:1}},{id:`nothing`,label:`주소만 알려 준다`,good:!1,result:`작은 차가 와서 {name}가 탈 자리가 좁았어요. 크기와 몸무게를 미리 알려요.`}]},{id:`pt2`,scene:`🚐🧺`,text:`도착했어요. 시트에 {name}의 털이 잔뜩 묻었어요.`,choices:[{id:`go`,label:`그냥 내린다`,good:!1,result:`다음 손님이 털 때문에 불편할 수 있어요. 내리기 게 그대로 남아요. 여행지에서도 꼭 봉투로 치워요.`},{id:`bag`,label:`봉투로 치워 쓰레기통에 버린다`,good:!0,result:`깨끗한 바다를 지켰어요. 최고의 여행 매너!`,stats:{social:1}}]}],reward:{bones:120},edu:[`pl_beach`,`pl_stay`]}]},Rt=JSON.parse(`[{"id":"arrive","title":"첫날은 조용히","text":"새 집에 온 첫날은 낯설고 피곤해요. 여러 사람이 한꺼번에 만지기보다 조용히 쉬며 집 냄새에 익숙해지게 해 주세요."},{"id":"feed","title":"퍼피 밥은 나눠서","text":"어린 강아지는 위가 작아서 하루 사료 양을 3~4번에 나눠 줘요. 사람 음식(특히 초콜릿·포도·양파)은 위험해요.","why":{"split":"아기 강아지는 위가 작아서 한 번에 많이 먹으면 탈이 나요. 시간을 정해 주면 배변 시간도 예측하기 쉬워져요.","full":"언제든 먹게 두면 너무 많이 먹기 쉽고, 얼마나 먹었는지 알기 어려워요. 배변 훈련도 어려워져요.","human":"양념·기름이 많은 음식, 초콜릿·포도·양파·자일리톨은 강아지에게 위험해요. 사람 음식은 주지 않아요."}},{"id":"water","title":"깨끗한 물은 언제나","text":"물은 항상 마실 수 있게 두고, 하루에 한 번 이상 새 물로 갈아 줘요."},{"id":"potty","title":"배변은 타이밍과 칭찬","text":"자고 일어났을 때, 밥 먹은 뒤, 놀고 난 뒤에 패드로 데려가요. 성공하면 바로 칭찬! 실수했을 때 혼내면 숨어서 싸게 돼요."},{"id":"crate","title":"나만의 안전한 집","text":"하우스(문이 달린 강아지용 작은 집, 켄넬)는 벌 주는 곳이 아니라 편히 쉬는 곳이에요. 좋아하는 담요와 장난감을 넣어 좋은 기억을 만들어 줘요.","cost":"하우스(켄넬) 약 3~10만 원","why":{"near":"곁에서 차분히 있어 주면 \\"여기는 안전한 곳\\"이라고 배워요. 며칠 지나면 혼자서도 잠들어요.","bed":"안아 주는 건 따뜻한 마음이지만, 매번 꺼내 주면 \\"울면 나갈 수 있다\\"고 배울 수 있어요. 하우스 옆에서 달래 주는 게 좋아요.","away":"엄마와 처음 떨어진 아기에게 혼자 남겨지는 건 아주 무서운 일이에요. 첫 며칠은 곁에서 안심시켜 주세요."}},{"id":"toy","title":"깨무는 건 자연스러운 일","text":"이가 나는 시기에는 뭐든 깨물고 싶어 해요. 손을 물면 놀이를 멈추고, 깨물어도 되는 장난감을 대신 주세요."},{"id":"vaccine","title":"예방접종 일정","text":"생후 6~8주부터 2~4주 간격으로 종합백신을 맞아요. 접종이 끝나기 전에는 다른 강아지가 많은 곳은 피하는 게 좋아요.","cost":"첫 진료 + 접종 약 3~6만 원","why":{"calm":"익숙한 사람이 차분하게 안아 주고, 끝나면 좋은 일(간식)이 생기면 병원을 덜 무서워하게 돼요. 접종 전에는 바닥을 걷지 않게 품에 안고 다녀요.","hold":"억지로 누르면 병원 = 무서운 곳으로 기억해요. 보정은 수의사 선생님과 함께 부드럽게 해요.","later":"예방접종은 시기를 지켜야 파보 장염·홍역 같은 무서운 병을 막을 수 있어요. 무서워하면 간식과 칭찬으로 도와주며 맞혀요."}},{"id":"name","title":"이름은 좋은 일과 함께","text":"이름을 부르고 다가오면 간식과 칭찬을 줘요. 혼낼 때 이름을 부르면 이름이 싫은 말이 될 수 있어요.","why":{"treat":"이름이 좋은 일과 이어지면, 불렀을 때 기쁘게 달려와요. 위험할 때 불러 세우는 데도 꼭 필요해요.","loud":"큰 소리로 여러 번 부르면 이름이 소음이 되고, 무서워서 피할 수 있어요.","scold":"혼낼 때 이름을 쓰면 이름이 싫은 말이 돼요. 혼낼 땐 이름 대신 \\"안 돼\\" 같은 짧은 말을 써요."}},{"id":"brush","title":"빗질은 짧고 즐겁게","text":"어릴 때부터 짧게 자주 빗질해 주면 몸을 만지는 걸 좋아하게 돼요. 털이 많이 빠지는 견종(골든 리트리버·래브라도·시바견 등)은 빗질이 특히 중요하고, 털이 계속 자라는 견종(푸들·비숑 등)은 엉키지 않게 빗질해 줘요."},{"id":"leash","title":"목줄은 천천히","text":"처음엔 집 안에서 잠깐씩 목줄을 하고 간식을 줘요. 익숙해지면 줄을 달고 집 안을 함께 걸어 봐요.","why":{"slow":"짧게, 좋은 일(간식)과 함께 하면 목줄은 즐거운 산책이라고 배워요.","drag":"억지로 끌면 목줄과 바깥을 무서워하게 될 수 있어요.","skip":"목줄은 강아지를 지켜 주는 안전장치예요. 우리나라는 법으로 외출할 때 목줄을 꼭 하게 되어 있어요."}},{"id":"vaccine_start","title":"종합백신은 6~8주부터","text":"종합백신은 생후 6~8주쯤 시작해서 2~4주 간격으로 여러 번 맞아요. 접종이 끝나기 전에는 다른 강아지가 많은 곳은 피해요.","why":{"go":"정해진 날짜에 맞춰야 면역이 제대로 생겨요.","postpone":"조금 늦는 건 괜찮지만, 그동안 감염 위험이 커져요. 다시 날짜를 꼭 잡아요."},"cost":"종합백신 1회 약 3~5만 원 (병원마다 달라요)"},{"id":"potty_accident","title":"실수에는 침착하게","text":"실수했을 때 혼내면 \\"보호자 앞에서 싸면 혼난다\\"고 배워서 숨어서 싸게 돼요. 조용히 치우고, 성공했을 때 바로 칭찬하는 게 배변 훈련의 기본이에요.","why":{"angry":"혼내면 배변 자체를 숨기게 되고 신뢰가 떨어져요.","calm":"타이밍 맞추기 + 성공하면 바로 칭찬이 가장 빠른 방법이에요."}},{"id":"chewing","title":"이가 날 때는 씹고 싶어요","text":"생후 3~6개월은 이갈이 시기라 뭐든 씹고 싶어 해요. 혼내기보다 씹어도 되는 장난감으로 바꿔 주세요.","why":{"redirect":"하고 싶은 행동(씹기)을 괜찮은 물건으로 바꿔 주는 게 핵심이에요.","ignore":"그냥 두면 신발·가구도 씹어도 된다고 배워요.","scold":"이갈이는 자연스러운 일이라, 혼나면 이유를 모른 채 겁만 먹어요."}},{"id":"deworm","title":"구충제는 정해진 주기에","text":"기생충은 눈에 보이지 않아도 설사·체중 감소를 일으킬 수 있어요. 수의사가 정해 준 주기에 맞춰 꾸준히 먹여요.","why":{"give":"주기를 지키는 게 가장 중요해요.","skip":"한 번쯤 늦어도 되지만, 잊지 않게 날짜를 다시 정해요."},"cost":"구충제 1회 약 5천~1만 원"},{"id":"mouthing","title":"무는 힘 조절 배우기","text":"어린 강아지는 놀면서 \\"얼마나 세게 물면 아픈지\\"를 배워요. 세게 물면 놀이를 잠깐 멈춰서 알려 주세요.","why":{"play_on":"계속 놀아 주면 손을 세게 물어도 된다고 배워요.","stop_firmly":"놀이가 멈추는 게 강아지에게는 가장 확실한 신호예요."}},{"id":"vaccine_schedule","title":"접종은 끝까지","text":"종합백신은 보통 3~5번에 걸쳐 맞아요. 마지막 접종 뒤 2주쯤 지나야 면역이 충분히 생겨요.","why":{"go":"끝까지 맞혀야 파보·홍역 같은 위험한 병을 막을 수 있어요.","postpone":"미룰수록 위험한 시기가 길어져요."}},{"id":"wary_reaction","title":"겁이 날 땐 거리 두기","text":"억지로 무서운 대상 앞에 데려가면 공포가 더 커져요. 강아지가 편안한 거리에서 간식과 함께 좋은 기억을 만들어 줘요.","why":{"approach":"억지로 다가가게 하면 무서운 기억만 남아요.","distance":"편안한 거리에서 시작하는 게 사회화의 기본이에요."}},{"id":"rabies","title":"광견병 접종은 꼭","text":"광견병은 사람에게도 옮을 수 있는 병이라 생후 3개월쯤 꼭 맞히고, 그 뒤로 해마다 맞혀요.","why":{"go":"법으로도 권장되는 중요한 접종이에요.","postpone":"광견병은 걸리면 치료가 어려워요. 꼭 날짜를 잡아요."},"cost":"광견병 접종 약 1~3만 원 (지역 보건소 할인 행사도 있어요)"},{"id":"separation_early","title":"나갈 때는 차분하게","text":"나갈 때 오래 달래 주면 \\"보호자가 나가는 건 큰일\\"이라고 배워요. 장난감을 주고 담담하게 나갔다 오는 연습을 해요.","why":{"comfort":"요란한 인사는 오히려 불안을 키워요.","leave_calmly":"짧고 차분한 외출이 혼자 있는 연습이 돼요."}},{"id":"puppy_summary","title":"퍼피기는 평생의 바탕","text":"생후 6개월까지의 경험이 앞으로의 성격과 행동에 큰 영향을 줘요. 이 시기에 쌓은 신뢰와 습관이 개춘기를 버티는 힘이 돼요."},{"id":"puberty","title":"몸이 어른이 되어 가요","text":"생후 6개월쯤부터 암컷은 첫 발정이 오고, 수컷은 다리를 들고 마킹하거나 마운팅이 늘 수 있어요. 작은 견종은 1년 안에 다 자라지만, 리트리버 같은 대형견은 1년 넘게 걸려요."},{"id":"neuter","title":"중성화는 수의사와 함께 정해요","text":"중성화는 원치 않는 임신을 막고, 암컷의 자궁축농증·유선종양, 수컷의 전립선 질환 위험을 줄여요. 대형견은 너무 이른 중성화가 관절 질환 위험을 높일 수 있다는 연구도 있어서 시기는 수의사와 상의해요.","why":{"now":"건강 상태를 확인하고 정했다면 좋은 선택이에요.","later":"대형견은 성장을 보고 정하는 것도 좋은 방법이에요.","never":"하지 않는 것도 보호자의 선택이에요. 대신 발정기 관리와 정기 검진이 더 중요해져요."},"cost":"중성화 수술 약 20~40만 원 (크기·성별·병원에 따라 달라요)"},{"id":"neuter_recovery","title":"수술 뒤 7~10일","text":"상처를 핥지 않게 넥카라를 씌우고, 뛰거나 목욕하는 건 피해요. 상처가 붓거나 진물이 나면 바로 병원에 가요.","why":{"rest":"답답해도 넥카라와 휴식이 가장 빠른 회복 방법이에요.","walk":"상처를 핥거나 뛰면 염증이 생겨 회복이 더 늦어져요."}},{"id":"chewing_teen","title":"지루하면 더 씹어요","text":"개춘기의 물어뜯기는 에너지가 남거나 지루할 때 심해져요. 산책·공놀이·노즈워크로 에너지를 풀어 주고, 망가지면 안 되는 물건은 미리 치워요.","why":{"redirect":"환경을 바꾸고 대신할 거리를 주는 게 가장 효과적이에요.","ignore":"그냥 두면 씹는 습관이 굳어요.","scold":"강아지는 몇 분 전 일과 혼나는 걸 연결하지 못해요."}},{"id":"leash_pulling","title":"당기면 멈추기","text":"줄을 당길 때 따라가면 \\"당기면 원하는 곳에 간다\\"를 배워요. 줄이 팽팽해지면 멈추고, 느슨해지면 다시 걷기를 반복해요.","why":{"stop_wait":"멈춤 → 느슨해지면 출발, 이걸 반복하는 게 정답이에요.","follow":"따라가면 당기는 행동이 보상을 받아요.","jerk":"줄을 세게 잡아채면 목과 기관지를 다칠 수 있어요."}},{"id":"fear_period","title":"2차 공포기","text":"생후 6~14개월쯤 갑자기 겁이 많아지는 시기가 올 수 있어요. 억지로 다가가게 하면 공포가 오래 남아요. 거리를 두고 간식으로 좋은 기억을 만들어 줘요.","why":{"calm":"거리 + 간식 + 천천히, 공포를 줄이는 기본 방법이에요.","ignore":"지나가는 건 괜찮지만, 좋은 기억을 만들어 주면 더 빨리 나아져요.","force":"억지로 마주하게 하면 공포가 더 깊어져요."}},{"id":"separation_teen","title":"분리불안 신호","text":"혼자 있을 때 오래 짖거나 문을 긁으면 분리불안 신호일 수 있어요. 아주 짧게 나갔다 오는 연습부터 시작해 시간을 늘리고, 심하면 수의사와 상담해요.","why":{"train":"짧은 시간부터 늘려 가는 게 가장 확실한 방법이에요.","ignore":"분리불안은 저절로 나아지기보다 심해지는 경우가 많아요."}},{"id":"mounting","title":"마운팅은 흥분 신호이기도 해요","text":"마운팅은 성적 행동만이 아니라 흥분·놀이·스트레스 때문에도 나와요. 혼내기보다 차분히 떼어 내고 \\"앉아\\" 같은 다른 행동으로 바꿔 줘요.","why":{"stop":"다른 행동으로 바꿔 주는 게 가장 좋아요.","let":"다른 개에게 하면 싸움이 날 수도 있어요."}},{"id":"marking","title":"산책 예절","text":"여기저기 소변을 묻히는 건 영역 표시예요. 남의 집·가게 앞에서는 줄을 짧게 잡고 지나가고, 묻힌 곳은 물로 씻어 주는 게 예의예요.","why":{"stop":"이웃과 함께 사는 예절이에요.","allow":"마킹을 그냥 두면 습관이 되고 이웃에게 피해가 갈 수 있어요."}},{"id":"hard_times","title":"힘든 건 잘못이 아니에요","text":"개춘기는 많은 보호자가 가장 힘들어하는 시기예요. 대부분 두 살 무렵이면 차분해져요. 혼자 버티기 어렵다면 반려견 행동 전문가나 수의 행동 클리닉에 도움을 청해요.","why":{"help":"도움을 청하는 건 책임감 있는 선택이에요.","resolve":"마음을 다잡는 것도 좋아요. 그래도 힘들 땐 언제든 도움을 청해요."}},{"id":"teen_summary","title":"이제 어른 강아지","text":"개춘기에 쌓은 훈련과 신뢰는 앞으로 함께할 성견 생활의 바탕이 돼요. 1년에 한 번은 건강 검진을 받아요."},{"id":"food_label","title":"좋은 사료 고르기","text":"비싼 사료가 꼭 좋은 사료는 아니에요. 성장 단계(퍼피·성견·노령견)에 맞는지, 원재료 표 첫 줄에 고기가 있는지, 급여량을 확인해요. 사료를 바꿀 때는 7~10일에 걸쳐 조금씩 섞어 바꿔야 배탈이 안 나요.","cost":"사료 1kg 약 1~4만 원 (종류에 따라 차이가 커요)"},{"id":"grooming","title":"털 관리는 꾸준히","text":"털이 많이 빠지는 견종은 자주, 털이 계속 자라는 견종은 엉키지 않게 빗질해 줘요. 목욕은 한 달에 1~2번이면 충분하고, 너무 자주 하면 피부가 건조해져요. 발톱은 2~4주마다 다듬고 귀도 살펴봐요. 미용은 강아지에게 낯설 수 있으니 짧게, 간식과 함께 익숙해지게 해요.","cost":"미용 1회 약 3~8만 원 (크기·털 상태에 따라 달라요)"},{"id":"clothes","title":"옷은 필요할 때만","text":"강아지 옷은 추운 날·비 오는 날 체온을 지켜 주지만, 꽉 끼거나 오래 입으면 피부가 짓무를 수 있어요. 싫어하면 억지로 입히지 말고, 입힌 뒤에는 불편해하지 않는지 살펴봐요."},{"id":"ev_sleep","title":"아기 강아지는 잠꾸러기","text":"생후 2~3개월 강아지는 하루 18~20시간을 자요. 자는 동안 몸과 뇌가 자라요. 조용한 잠자리를 마련하고 억지로 깨우지 마세요. 다만 깨어 있을 때도 축 처지고 밥을 안 먹으면 병원에 가요.","why":{"let":"충분히 자야 깨어 있을 때 잘 놀고 잘 배워요.","wake":"자는 아기 강아지를 자꾸 깨우면 예민해지고 피곤이 쌓여요."}},{"id":"ev_social","title":"사회화는 지금부터","text":"생후 3~14주는 세상을 배우는 \\"사회화 시기\\"예요. 이때 여러 사람·소리·물건을 좋은 기억(간식·칭찬)과 함께 조금씩 만나면, 커서도 겁이 적어요. 접종 전에는 집에서, 한 번에 한 명씩, 짧게 만나게 해요.","why":{"quiet":"한 명씩 조용히, 간식과 함께 만나면 사람 = 좋은 일로 기억해요.","party":"한꺼번에 많은 사람은 아기 강아지에게 무서운 경험이 될 수 있어요.","no":"아무도 안 만나면 이 시기를 놓쳐 낯선 사람을 무서워할 수 있어요."}},{"id":"ev_bath","title":"목욕은 천천히","text":"집에 온 지 얼마 안 된 아기 강아지는 체온 조절이 서툴고 스트레스에 약해요. 전신 목욕은 적응하고 기본 접종을 시작한 뒤에, 짧고 따뜻하게 해요. 그 전에는 더러운 곳만 닦아 줘요.","why":{"wipe":"부분만 닦으면 체온을 지키면서 깨끗하게 할 수 있어요.","bath":"적응 전 전신 목욕은 감기·스트레스의 원인이 될 수 있어요."}},{"id":"ev_potty_time","title":"배변은 타이밍이 반","text":"아기 강아지는 자고 일어났을 때, 밥 먹은 뒤, 신나게 논 뒤에 곧 배변을 해요. 바닥 냄새를 맡거나 빙글빙글 돌면 신호예요. 그때 패드로 데려가 성공하면 바로 칭찬해요.","why":{"pad":"신호를 보고 바로 데려가면 성공 경험이 쌓여요.","food":"신호를 놓치면 실수가 습관이 되기 쉬워요."}},{"id":"ev_accident","title":"실수에는 침착하게","text":"배변 실수를 혼내면 강아지는 \\"쉬를 하면 혼난다\\"로 배워서 숨어서 하게 돼요. 실수는 말없이 치우고 냄새(효소 탈취제)까지 없애요. 성공했을 때 바로 칭찬하는 게 가장 빨라요.","why":{"clean":"성공에 칭찬이 쌓이면 패드 = 좋은 곳이 돼요.","scold":"혼나면 배변 자체를 숨기게 돼 훈련이 더 어려워져요."}},{"id":"ev_crate_love","title":"집은 쉬는 곳","text":"하우스(작은 집)를 벌주는 곳으로 쓰지 않고, 간식·장난감·편한 담요와 함께 쓰면 강아지가 스스로 들어가 쉬는 안전한 자리가 돼요. 병원·여행·재난 때도 큰 도움이 돼요."},{"id":"ev_proof","title":"강아지 눈높이로 집 정리","text":"이가 나는 시기의 강아지는 무엇이든 씹어요. 전선·충전기·약·작은 장난감·양말·초콜릿은 물리기 전에 치우는 게 최선이에요. 물면 안 되는 걸 물었을 땐 혼내기보다 씹어도 되는 장난감과 바꿔 줘요.","why":{"swap":"바꿔 주기는 \\"이건 되고 저건 안 돼\\"를 가장 쉽게 알려 줘요.","yell":"쫓아가 빼앗으면 신나는 놀이가 되어 더 자주 물어요."}},{"id":"ev_toxic","title":"강아지에게 위험한 음식","text":"포도·건포도(신장), 초콜릿·카페인(심장·신경), 양파·마늘·파(빈혈), 자일리톨 껌·사탕(저혈당), 마카다미아, 익힌 뼈는 소량이라도 위험해요. 먹었다면 양과 시간을 확인해 바로 동물병원에 연락해요.","why":{"place":"조르기에 반응하지 않으면 식탁 매너가 자리 잡아요.","grape":"포도는 한 알로도 급성 신부전이 올 수 있어요.","treat":"간식이라도 조를 때 주면 조르기가 늘어요."}},{"id":"ev_zoomies","title":"우다다는 정상이에요","text":"갑자기 전력 질주하는 \\"우다다(줌이)\\"는 남은 에너지와 신나는 기분을 푸는 정상 행동이에요. 잠깐 지켜보고 부딪힐 물건만 치워 주세요. 미끄러운 바닥은 관절에 무리가 가니 매트를 깔면 좋아요.","why":{"watch":"스스로 진정하게 두면 흥분이 금방 가라앉아요.","chase":"쫓아가면 흥분이 더 커지고, 미끄러져 다칠 수 있어요."}},{"id":"ev_bite","title":"무는 힘 조절 배우기","text":"강아지는 형제와 놀며 \\"세게 물면 놀이가 끝난다\\"를 배워요. 사람도 세게 물리면 짧게 \\"아야!\\" 하고 잠깐 놀이를 멈추면 돼요. 손 대신 터그 장난감으로 놀아 주고, 때리는 벌은 사람 손을 무서워하게 만들어요.","why":{"ouch":"놀이가 멈추면 \\"세게 물면 재미없다\\"를 배워요.","hand":"손으로 놀아 주면 손을 무는 습관이 굳어요.","hit":"때리면 손을 겁내고 방어하려고 더 물 수 있어요."}},{"id":"ev_name_again","title":"이름은 언제나 좋은 신호","text":"혼낼 때 이름을 부르면 강아지는 이름을 \\"혼나는 신호\\"로 배워요. 이름을 다시 좋은 신호로 만들려면 한동안 이름을 부를 때마다 간식·칭찬·놀이만 주세요. 혼낼 일이 있으면 이름 대신 짧은 \\"아!\\" 소리를 써요.","why":{"restart":"이름 = 좋은 일을 다시 쌓으면 금방 회복돼요.","louder":"목소리가 커질수록 더 무서운 신호가 돼요."}},{"id":"ev_feed_again","title":"아기 강아지 밥 주기","text":"아기 강아지는 위가 작아서 하루 양을 3~4번에 나눠 줘야 해요. 사료 봉투의 \\"체중별 하루 양\\"을 저울로 재서 주고, 사람 음식은 주지 않아요. 토하거나 설사가 이어지면 병원에 가요.","why":{"split":"나눠 주면 소화가 편하고 혈당도 고르게 유지돼요.","same":"한 번에 많이 먹으면 토하거나 설사하기 쉬워요."}},{"id":"ev_out_early","title":"접종 전 외출","text":"기본 접종이 끝나기 전에는 다른 개·배설물과 닿으면 파보 같은 병에 걸릴 수 있어요. 그래도 안거나 가방에 넣고 바깥 소리·사람·차를 멀리서 보여 주면 사회화에 큰 도움이 돼요.","why":{"hold":"안전하게 거리를 두고 보는 것만으로도 세상을 배워요.","down":"접종 전 직접 접촉은 감염 위험이 있고, 큰 개는 무서울 수 있어요."}},{"id":"ev_weight","title":"체중은 건강 신호","text":"아기 강아지는 매주 체중을 재서 꾸준히 느는지 봐요. 사료 양도 체중에 맞춰 바꿔요. 갑자기 줄거나 늘지 않으면 기생충·질병 신호일 수 있어요. 병원에 자주 놀러 가서 간식을 받으면 병원을 덜 무서워해요."},{"id":"ev_night","title":"첫 주의 밤","text":"엄마·형제와 떨어진 아기 강아지가 밤에 우는 건 당연해요. 첫 1~2주는 잠자리를 사람 가까이 두고, 울면 조용히 곁에 있다는 것만 알려 주세요. 익숙해지면 조금씩 자리를 옮겨요. 우는 동안 꺼내 주면 \\"울면 나간다\\"를 배워요.","why":{"near":"가까이서 안심시키면 혼자 자는 법도 빨리 배워요.","pick":"울 때마다 꺼내 주면 우는 게 습관이 돼요.","ignore":"혼자 오래 울게 두면 불안이 커질 수 있어요."}},{"id":"tr_sit","title":"앉아는 간식으로 유도해요","text":"간식을 머리 위로 올리면 강아지는 고개를 들면서 저절로 앉아요. 앉는 순간 바로(1초 안에) 칭찬과 간식을 주는 게 핵심이에요. 엉덩이를 손으로 누르지 않아요."},{"id":"tr_paw","title":"손은 스스로 하게","text":"발을 억지로 잡지 않고, 강아지가 스스로 앞발을 올리게 기다려요. 몇 번 성공하면 간식 없이 손바닥만 보여 줘도 해요. 짧게 3~5번, 하루 몇 번이면 충분해요."},{"id":"tr_wait","title":"기다려는 아주 조금씩","text":"처음엔 1초, 한 걸음이면 충분해요. 시간과 거리를 한꺼번에 늘리지 말고 하나씩 늘려요. 실패하면 혼내지 말고 더 쉬운 단계로 돌아가요."},{"id":"tr_down","title":"엎드려는 간식을 바닥으로","text":"간식을 코앞에서 바닥으로, 그다음 앞으로 끌면 몸이 따라 엎드려요. 엎드려는 차분하게 기다리는 자세라서 흥분을 가라앉힐 때도 좋아요."},{"id":"tr_house","title":"하우스는 좋은 곳으로","text":"하우스(켄넬)는 벌주는 곳이 아니라 쉬는 곳이에요. 간식·장난감으로 스스로 들어가게 하고, 문 닫는 시간은 몇 초부터 아주 천천히 늘려요. 병원·이동·재난 때 큰 도움이 돼요."},{"id":"tr_leash","title":"당기면 멈추기","text":"리드가 팽팽해지면 멈추고, 느슨해지면 걷기. 이것만 꾸준히 해도 \\"당기면 못 간다\\"를 배워요. 옆에서 잘 걸을 때 자주 칭찬해 줘요."},{"id":"wk_cat","title":"흥분하면 멈추기","text":"고양이·새처럼 흥분할 것을 보면 멈춰 서서 기다리고, 대상 대신 보호자를 보면 칭찬해요. 줄을 세게 당기면 목에 무리가 가고, 산책이 무서운 일이 돼요."},{"id":"wk_bone","title":"\\"놓아\\"는 교환으로","text":"익힌 닭뼈는 날카롭게 쪼개져 위험해요. 입에 문 것을 억지로 빼면 지키려고 물 수 있어요. 평소에 \\"놓아\\" 하고 더 좋은 간식과 바꾸는 연습을 해 두면 위험할 때 써요."},{"id":"wk_noise","title":"큰 소리에 익숙해지기","text":"큰 소리에 놀랐을 때 보호자가 담담하면 강아지도 빨리 진정해요. 소리 뒤에 간식을 주면 \\"큰 소리 = 좋은 일\\"로 조금씩 바뀌어요."},{"id":"wk_greet","title":"강아지 인사 예절","text":"다른 강아지와 인사할 땐 보호자에게 먼저 묻고, 3초 정도 짧게 냄새를 맡게 한 뒤 헤어져요. 공원에서는 줄을 매는 것이 기본이에요."},{"id":"wk_far","title":"멀리서 보는 것도 공부","text":"접종이 끝나기 전에는 다른 개와 닿지 않게 하되, 멀리서 차분하게 보는 경험은 사회화에 큰 도움이 돼요."},{"id":"wk_kids","title":"아이와 만날 때","text":"아이에게 손을 낮게 내밀어 냄새를 맡게 하고, 한 명씩 등을 살살 쓰다듬게 알려 줘요. 강아지가 피하거나 꼬리를 말면 그만해요."},{"id":"wk_rain","title":"비 온 뒤에는 꼼꼼히 말리기","text":"젖은 털을 그대로 두면 피부병·귓병이 생기기 쉬워요. 특히 귀가 덮인 견종은 귀 안까지 잘 말려 줘요."},{"id":"wk_sniff","title":"냄새 맡기는 머리 운동","text":"냄새를 맡는 산책(노즈워크)은 강아지에게 큰 즐거움이고 스트레스를 풀어 줘요. 풀숲을 다녀온 뒤에는 진드기를 꼭 확인해요."},{"id":"wk_pigeon","title":"쫓기 대신 이름 부르기","text":"쫓아가는 것을 함께 하면 습관이 돼요. 흥분할 때 이름을 불러 돌아보면 칭찬하는 연습이 \\"이리 와\\"의 바탕이 돼요."},{"id":"wk_reactive","title":"무서울 땐 거리 두기","text":"짖는 개를 만나면 억지로 다가가지 말고 거리를 둬요. 거리가 멀어지면 강아지는 스스로 진정할 수 있어요."},{"id":"hc_skin","title":"피부는 빨리 보여 주기","text":"발진·가려움·털 빠짐이 보이면 사진을 찍어 두고 병원에 가요. 사람 연고·약은 강아지가 핥아 먹거나 성분 때문에 해로울 수 있어요. 일찍 가면 치료가 짧고 쉬워요.","why":{"vet":"처음 보였을 때 진료받으면 금방 좋아져요.","cream":"사람 약은 강아지에게 위험할 수 있어요.","watch":"가려움을 두면 긁어서 상처·2차 감염이 생겨요."}},{"id":"hc_ear","title":"늘어진 귀는 자주 살피기","text":"귀가 덮인 견종은 습해서 외이염이 잘 생겨요. 냄새·갈색 귀지·머리 털기·귀 긁기가 신호예요. 세정제를 넣고 귀 뿌리를 마사지한 뒤 겉만 닦고, 면봉으로 깊이 파지 않아요.","why":{"vet":"원인(세균·곰팡이·진드기)을 알아야 맞는 약을 써요.","swab":"면봉은 귀지를 안으로 밀어 넣고 고막을 다치게 할 수 있어요.","watch":"염증은 시간이 지날수록 깊어져요."}},{"id":"hc_eye","title":"눈은 하루가 급해요","text":"눈이 빨갛거나, 찡그리거나, 눈물이 늘면 바로 병원에 가요. 포도막염·녹내장은 늦으면 시력을 잃을 수 있어요. 사람 안약은 넣지 않아요.","why":{"vet":"눈 질환은 빨리 갈수록 시력을 지킬 수 있어요.","drops":"사람 안약은 성분에 따라 눈을 더 나쁘게 해요.","wait":"하루 사이에 크게 나빠질 수 있어요."}},{"id":"hc_goop","title":"눈곱 닦기","text":"맑은 눈곱은 닦아 주면 되지만, 누렇거나 초록빛이고 계속되면 결막염일 수 있어요. 따뜻한 물에 적신 거즈로 눈 바깥쪽으로 살살 닦아요.","why":{"wipe":"부드럽게 닦고 지켜보는 게 맞아요.","pick":"손톱은 눈가 피부를 다치게 해요."}},{"id":"hc_joint","title":"관절은 어릴 때부터 지키기","text":"대형견은 고관절·팔꿈치 이형성증이 잘 생겨요. 미끄럽지 않은 바닥, 알맞은 체중, 성장기의 무리하지 않는 운동이 가장 좋은 예방이에요. 일어나기 힘들어하거나 엉덩이를 흔들며 걸으면 검사받아요.","why":{"vet":"일찍 알면 생활 습관만으로도 많이 좋아져요.","run":"자라는 시기의 무리한 운동은 관절을 상하게 해요.","watch":"통증 신호를 놓치면 나중에 더 힘들어져요."}},{"id":"hc_knee","title":"무릎이 빠지는 병","text":"슬개골 탈구는 걷다가 한 다리를 들고 깡충 뛰는 모습으로 보여요. 높은 데서 뛰어내리지 않게 계단을 놓고, 미끄럼 방지 매트를 깔아요.","why":{"vet":"정도를 알아야 관리 방법을 정할 수 있어요.","jump":"뛰어내리는 충격이 무릎에 가장 나빠요."}},{"id":"hc_weight","title":"알맞은 체중","text":"갈비뼈가 손에 살짝 만져지고 위에서 볼 때 허리가 들어가면 알맞아요. 래브라도는 살이 잘 쪄서 사료를 저울로 재고, 간식은 하루 열량의 10% 안으로 줘요.","why":{"measure":"정확히 재서 주는 것이 가장 쉬운 다이어트예요.","more":"비만은 관절·심장·당뇨의 원인이 돼요."}},{"id":"fc_show","title":"강아지 사진, 이렇게 찍어요","text":"플래시는 강아지 눈을 놀라게 하니 끄고, 밝은 낮에 강아지 눈높이로 앉아서 찍어요. 이름을 부르거나 간식을 카메라 옆에 들면 시선이 와요. 싫어하면 억지로 붙잡지 말고 다음에 찍어요."},{"id":"fc_heat","title":"여름 행사와 더위","text":"강아지는 땀을 거의 흘리지 못해 사람보다 더위에 약해요. 한낮 아스팔트는 발바닥을 데게 할 수 있어요(손등을 5초 대어 보기). 그늘·물을 자주 주고, 헐떡임이 심하거나 침을 많이 흘리면 바로 시원한 곳에서 쉬게 하고 병원에 연락해요."},{"id":"fc_cgc","title":"반려견 매너, 어떻게 기를까","text":"여러 나라에 '반려견 시민 교육(CGC)' 같은 매너 시험이 있어요. 낯선 사람에게 차분히 인사하기, 줄을 느슨하게 걷기, 다른 개 옆에서 기다리기 같은 것을 봐요. 잘했을 때 바로 칭찬하는 짧은 연습을 매일 조금씩 하면 길러져요."},{"id":"fc_recall","title":"「이리 와」가 좋아지는 법","text":"이름을 부르고 오면 늘 좋은 일(칭찬·간식·놀이)이 생기게 해요. 혼내려고, 목욕시키려고 부르면 부르는 소리가 싫어져요. 처음엔 집 안 짧은 거리에서, 한 번만 밝게 부르고 오면 크게 칭찬해요."},{"id":"fc_agility","title":"어린 강아지와 점프","text":"뼈와 관절이 다 자라기 전(대형견은 1살~1살 반)에는 높은 점프나 계단 뛰어내리기를 줄여요. 어질리티는 낮은 장애물·터널부터, 미끄럽지 않은 바닥에서 짧게 해요."},{"id":"fc_costume","title":"옷, 좋아할 때만","text":"강아지마다 옷을 싫어할 수 있어요. 몸을 굳히거나, 꼬리를 내리거나, 자꾸 긁고 물려고 하면 벗겨 주세요. 간식과 함께 짧게 입어 보며 익숙해지게 하고, 더운 날·혼자 있을 때는 입히지 않아요."},{"id":"wk_people_food","title":"사람 음식, 왜 안 될까","text":"떡·빵처럼 끈적한 음식은 목에 걸리기 쉽고, 양파·포도·초콜릿·자일리톨은 강아지에게 독이에요. 짠 음식도 몸에 부담이 돼요. 이웃이 주려 하면 고맙다고 하고 정중히 사양하거나, 강아지 간식을 대신 드려 주게 해요."},{"id":"wk_explore","title":"접종 전 바깥 구경","text":"예방접종이 끝나기 전이라도 바깥 소리·냄새를 알려 주는 건 중요해요(사회화 시기). 다른 개가 많이 다니는 곳은 피하고, 안거나 깨끗한 곳에서 잠깐씩 냄새를 맡게 해요."},{"id":"ev2_teeth","title":"이갈이 시기","text":"생후 4~6개월에 젖니가 빠지고 어른 이가 나요. 잇몸이 간지러워 뭐든 씹으려 해요. 차갑게 한 씹는 장난감이 도움이 되고, 흔들리는 이를 억지로 빼지 않아요. 젖니가 안 빠지고 겹쳐 나면 병원에서 상담해요."},{"id":"ev2_trade","title":"「놔」는 교환으로","text":"물건을 문 강아지를 쫓아가면 놀이가 되고, 혼내면 급하게 삼킬 수 있어요. 더 좋은 간식을 보여 주며 \\"놔\\"라고 하고, 놓으면 간식을 줘요. 놓아도 손해가 아니라는 걸 배워요."},{"id":"ev2_hide_pee","title":"숨어서 쉬하는 이유","text":"실수를 혼나면 강아지는 \\"쉬 하는 것\\"이 혼나는 일이라고 배워 사람 눈을 피해 숨어서 해요. 실수는 조용히 치우고(효소 세정제로 냄새까지), 성공했을 때 바로 칭찬해요."},{"id":"ev2_praise_now","title":"칭찬은 3초 안에","text":"강아지는 행동과 결과를 아주 짧은 시간 안에서만 이어서 생각해요. 잘한 순간 바로(3초 안에) 칭찬과 간식을 줘야 무엇을 잘했는지 알아요."},{"id":"ev2_doorbell","title":"초인종에 짖을 때","text":"같이 소리치면 함께 짖는 줄 알아요. 초인종 소리를 작게 들려주고 오면 간식 주기를 반복해, \\"소리가 나면 보호자에게 간다\\"를 가르쳐요."},{"id":"ev2_nails","title":"발톱 깎기는 조금씩","text":"발을 만지는 것부터 하루 몇 초씩 익숙해지게 해요. 발톱 안쪽 분홍빛 혈관(퀵)은 자르지 않고 끝만 조금씩. 검은 발톱은 더 조심해요. 어려우면 병원·미용실에 맡겨요."},{"id":"ev2_teeth_brush","title":"강아지 양치","text":"사람 치약에는 강아지에게 해로운 성분(자일리톨 등)이 있을 수 있어 강아지 전용 치약을 써요. 맛을 보여 주고 손가락으로 앞니부터, 매일 짧게 하면 익숙해져요."},{"id":"ev2_collar_fit","title":"목줄·하네스 맞추기","text":"목줄과 몸 사이에 손가락 두 개가 들어가는 정도가 알맞아요. 자라는 시기에는 한두 주마다 확인해요. 꽉 끼면 털이 빠지고 피부가 상해요."},{"id":"ev2_nosework","title":"비 오는 날 노즈워크","text":"간식을 숨겨 냄새로 찾게 하는 놀이는 짧은 시간에도 강아지를 만족시키고 차분하게 해 줘요. 실내에서 하기 좋은 놀이예요."},{"id":"ev2_hide_chew","title":"숨어서 씹는다면","text":"씹는 건 강아지에게 꼭 필요한 일이에요. 씹어도 되는 물건을 늘 곁에 두고, 안 되는 물건은 치워요. 혼내기만 하면 숨어서 씹게 돼요."},{"id":"ev2_bite_inhibit","title":"무는 힘 조절","text":"어릴 때 세게 물면 놀이가 끝나는 경험을 통해 무는 힘을 조절하는 법을 배워요. 손으로 놀아 주지 말고 장난감으로 놀아요."},{"id":"ev2_guest","title":"낯선 손님 맞이","text":"억지로 인사시키면 더 무서워해요. 손님은 강아지를 모른 척하고, 강아지가 스스로 다가오면 간식을 바닥에 놓아 주게 해요. 숨을 곳도 남겨 둬요."},{"id":"ev2_separation","title":"분리불안 줄이기","text":"나갈 때와 들어올 때 크게 인사하지 않아요. 몇 초 → 몇 분으로 아주 짧게 나갔다 오는 연습을 하고, 혼자 있을 때 씹을 장난감을 줘요. 심하면 전문가와 상담해요."},{"id":"ev2_puppy_play","title":"강아지끼리 놀 때","text":"좋은 놀이는 서로 번갈아 쫓고 쫓기며 중간에 쉬어요. 한쪽이 계속 피하거나 숨으면 불러서 쉬게 해요. 접종을 마친 뒤 건강한 강아지들과 놀아요."},{"id":"ev2_vet_happy","title":"병원을 좋아하게","text":"진료가 없는 날에도 병원에 들러 간식만 받고 나오면, 병원이 무서운 곳이 아니라는 걸 배워요. 진료대 위에서는 간식과 부드러운 손길로 안심시켜요."},{"id":"ev3_recall_teen","title":"개춘기의 「이리 와」","text":"6개월~2살 사이엔 부르면 못 들은 척하기도 해요. 혼내거나 여러 번 부르기보다, 이름을 부를 땐 늘 좋은 일이 생기게 하고 한 번만 불러요. 안전한 곳에서는 긴 줄로 연습해요."},{"id":"ev3_counter","title":"식탁 위 도둑질","text":"음식이 닿는 곳에 있으면 한 번 성공한 경험으로 계속 시도해요. 음식은 치워 두고, 네 발이 바닥에 있을 때 칭찬해요. 쫓아가면 급하게 삼킬 수 있어요."},{"id":"ev3_fear_period","title":"두 번째 겁쟁이 시기","text":"청소년기에 익숙하던 것을 갑자기 무서워하는 시기가 올 수 있어요. 놀리거나 억지로 다가가게 하지 말고, 스스로 다가갈 때 칭찬하며 천천히 익숙해지게 해요."},{"id":"ev3_dig","title":"땅 파기","text":"땅 파기는 자연스러운 본능이에요. 파도 되는 곳(모래밭·땅파기 상자)을 정해 장난감을 묻어 주면 마음껏 풀 수 있어요."},{"id":"ev3_marking_home","title":"집 안 마킹","text":"다리를 들고 조금씩 표시하는 마킹은 혼내서 없어지지 않아요. 냄새를 효소 세정제로 없애고, 산책 때 냄새 맡을 시간을 충분히 줘요. 갑자기 늘면 방광염 같은 병일 수도 있어 병원에서 확인해요."},{"id":"ev3_wound","title":"수술 부위 관리","text":"수술 부위를 핥으면 덧나거나 실밥이 풀려요. 다 나을 때까지 넥카라를 씌우고, 빨갛게 붓거나 진물이 나면 바로 병원에 가요."},{"id":"ev3_pulling","title":"줄 당김과 하네스","text":"세게 잡아채면 목에 무리가 가고 줄이 팽팽하면 아프다고 배워요. 가슴 앞에 고리가 있는 하네스는 당김을 줄이는 데 도움이 되고, \\"당기면 멈추고 느슨하면 걷기\\"를 꾸준히 해요."},{"id":"ev3_dog_play","title":"친구 강아지와 놀이","text":"몸을 낮추는 \\"놀자 인사(플레이 바우)\\"는 놀이 신호예요. 서로 번갈아 쫓고 쉬면 건강한 놀이예요. 한쪽이 피하면 잠깐 떼어 쉬게 해요."},{"id":"ev3_resource","title":"밥그릇 지키기","text":"그릇을 뺏으면 더 지키려고 해요. 다가갈 때 더 맛있는 것을 넣어 주면 사람이 다가오는 게 좋은 일이 돼요. 물려고 하면 혼자 하지 말고 전문가와 상담해요."},{"id":"ev3_boredom","title":"심심하면 사고를 쳐요","text":"에너지가 많은 청소년기엔 운동과 머리 쓰는 놀이가 부족하면 물건을 망가뜨려요. 한참 지난 뒤에 혼내면 강아지는 이유를 몰라요."},{"id":"ev3_shedding","title":"털갈이","text":"봄·가을에 털이 많이 빠져요(이중모 견종은 특히). 매일 빗질이 가장 좋고, 목욕을 너무 자주 하면 피부가 건조해져요."},{"id":"ev3_heartworm","title":"심장사상충 예방","text":"모기가 옮기는 심장사상충은 걸리면 치료가 어렵고 위험해요. 수의사가 정한 대로 매달 예방약을 먹이고, 잊었다면 다시 시작하기 전에 검사부터 해요."},{"id":"ev3_alone_ok","title":"혼자 있기 성공","text":"혼자 잘 있었을 때 돌아와서 조용히, 차분하게 칭찬해요. 크게 흥분시키면 다음 외출 때 기대와 불안이 커질 수 있어요."},{"id":"ev3_bond","title":"함께 있는 시간","text":"특별한 훈련이 없어도 곁에 앉아 쓰다듬는 시간은 강아지에게 큰 안정감을 줘요. 하루에 잠깐이라도 휴대폰을 내려놓고 함께해요."},{"id":"fc_fetch","title":"공놀이는 짧고 즐겁게","text":"공놀이는 몸과 머리를 함께 쓰는 좋은 놀이예요. 한 번에 10~15분, 중간에 물과 쉬는 시간을 줘요. 어린 강아지는 높이 뛰어 받기보다 땅에서 굴려 주고, 더운 날 한낮은 피해요. 「놔」로 공을 돌려받는 연습도 같이 하면 좋아요."},{"id":"tp_pack","title":"나들이 준비물","text":"멀리 갈 때는 이동장·목줄(2m 이내)·인식표·배변봉투·물·예방접종 증명서를 챙겨요. 익숙한 담요는 낯선 곳에서 마음을 편하게 해 줘요."},{"id":"tp_bus","title":"버스는 이동장에 넣어서","text":"버스는 전용 이동장(운반 상자)에 넣은 반려동물만 탈 수 있어요. 이동장 밖으로 꺼내지 않고, 다른 승객이 놀라지 않게 덮개를 덮어 조용히 데려가요. 이동장에 안 들어가는 큰 개는 탈 수 없어요."},{"id":"tp_subway","title":"지하철은 한산한 시간에","text":"지하철은 밀폐형 이동장에 넣어 밖에서 보이지 않고 냄새가 나지 않게 해야 해요. 뚜껑 열린 유모차는 안 되는 곳이 많아요. 붐비는 시간을 피하고, 이동장은 무릎 위나 발 앞에 둬요."},{"id":"tp_taxi","title":"택시는 먼저 여쭤보기","text":"택시는 기사님 판단에 따라 반려동물 탑승을 거절할 수 있어요. 이동장에 넣고, 타기 전에 \\"강아지와 타도 될까요?\\" 하고 먼저 여쭤봐요. 큰 개는 펫택시를 예약해요."},{"id":"tp_train","title":"기차는 증명서와 이동장","text":"기차는 이동장에 넣은 반려동물만 탈 수 있고, 고속열차는 예방접종 증명서를 확인하기도 해요. 열차 안에서는 꺼내지 않아요. 크기·무게 기준은 철도 회사마다 달라서 예매 전에 꼭 확인해요."},{"id":"tp_car","title":"차에서는 뒷좌석에 고정","text":"동물을 안고 운전하면 도로교통법 위반이에요(승용차 범칙금 4만 원). 이동장이나 카시트를 뒷좌석에 벨트로 고정하고, 창밖으로 고개를 내밀지 않게 해요. 더운 날 차 안에 혼자 두면 몇 분 만에 열사병이 와요."},{"id":"tp_pettaxi","title":"큰 개는 펫택시","text":"대형견은 대중교통을 타기 어려워요. 반려동물 전용 택시를 예약할 때는 견종·몸무게·멀미 여부를 미리 알리고, 담요를 깔아 털이 남지 않게 해요."},{"id":"tp_ship","title":"배는 선사마다 규정이 달라요","text":"여객선은 배 회사마다 반려동물이 머물 수 있는 곳과 이동장 기준이 달라요. 예약 전에 꼭 확인하고, 멀미에 대비해 출발 몇 시간 전부터 밥을 줄이고 물은 조금씩 줘요. 멀미약은 수의사와 상담해요."},{"id":"tp_plane","title":"비행기: 기내와 화물칸","text":"국내 항공사는 보통 이동장을 포함해 7kg 이하(항공사마다 조금 다름)일 때 기내에 함께 탈 수 있고, 무거우면 화물칸으로 가요. 화물칸은 소음·온도 변화로 스트레스가 크고, 납작코(단두종)·맹견은 제한되기도 해요. 사람 수면제는 절대 먹이지 않아요."},{"id":"pl_elevator","title":"공용 공간에서는 안아 주세요","text":"아파트·빌라·오피스텔의 엘리베이터와 계단 같은 공용 공간에서는 강아지를 안거나 목덜미를 잡아 돌발 행동을 막아야 해요(동물보호법). 먼저 탄 사람에게 함께 타도 되는지 물어봐요."},{"id":"pl_house","title":"남의 집에 갈 때","text":"방문 전에 강아지와 가도 되는지 묻고, 미리 산책해 배변을 하고 들어가요. 사람 음식은 주지 않고, 가구·침대에 올라가도 되는지 집주인에게 먼저 물어봐요."},{"id":"pl_cafe","title":"애견카페 약속","text":"예방접종을 마치고, 발정 중이거나 아프면 다음에 가요. 마운팅이나 거친 놀이는 바로 말리고, 남의 강아지에게는 허락 없이 간식을 주지 않아요. 내 강아지 배설물은 내가 바로 치워요."},{"id":"pl_mall","title":"쇼핑몰에서는","text":"반려견 동반 쇼핑몰도 예방접종을 마친 강아지만, 줄을 짧게 잡고 들어갈 수 있어요. 에스컬레이터는 발이 끼일 수 있어 엘리베이터를 타요. 식당·푸드코트처럼 출입이 안 되는 매장은 안내 표시를 확인하고, 실내 마킹이 걱정되면 매너벨트를 채워요."},{"id":"pl_friend_cat","title":"다른 동물이 사는 집","text":"고양이나 다른 동물이 사는 집에서는 줄을 짧게 잡고 멀리서 천천히 냄새부터 익히게 해요. 밥그릇·장난감·화장실은 그 집 동물의 것이니 건드리지 않게 해요."},{"id":"pl_beach","title":"여행지에서도 펫티켓","text":"해수욕장은 운영 기간에 반려동물 출입을 막는 곳이 많아요. 반려견 동반이 되는 곳을 미리 찾고, 모래밭의 배설물도 꼭 봉투로 치워요."},{"id":"pl_stay","title":"동반 숙소와 음식점","text":"반려동물 동반 숙소에서도 강아지를 방에 혼자 두고 나가지 않아요. 반려동물 동반 음식점은 예방접종 확인을 하고, 케이지나 전용 의자를 쓰거나 안고 있어야 해요."}]`),zt=[{look:`golden`,breed:`골든 리트리버`,intro:`골든 리트리버는 순하고 똑똑하지만, 집안 내력처럼 잘 생기는 병이 몇 가지 있어요.`,conditions:[{name:`고관절·팔꿈치 이형성증`,what:`엉덩이와 팔꿈치 관절이 꼭 맞물리지 않게 자라는 병이에요. 크면서 관절이 닳아 아파요.`,sign:`일어날 때 힘들어하거나, 뒷다리를 절거나, 토끼처럼 두 다리를 모아 뛰어요.`,care:`살이 찌지 않게 하고, 어릴 때 높은 곳 점프나 계단 오르내리기를 줄여요. 엑스레이로 확인해요.`},{name:`암 (혈관육종·림프종)`,what:`골든 리트리버는 다른 견종보다 암이 잘 생기는 편이에요.`,sign:`몸에 혹이 만져지거나, 갑자기 기운이 없고 잇몸이 하얗게 보여요.`,care:`쓰다듬을 때 혹이 있는지 살피고, 7살이 넘으면 해마다 건강검진을 받아요.`},{name:`대동맥판 아래 협착 (심장)`,what:`심장에서 피가 나가는 길이 좁게 태어나는 병이에요.`,sign:`쉽게 지치거나, 운동하다 쓰러지기도 해요. 청진기로 심장 소리가 이상하게 들려요.`,care:`접종 때 심장 소리를 들어 보고, 이상하면 심장 초음파로 확인해요.`},{name:`포도막염 (눈)`,what:`눈 안쪽에 염증이 생기는 병이에요. 골든 리트리버에게 잘 생기는 종류가 따로 있어요.`,sign:`눈이 빨갛거나 눈을 자주 찡그리고 눈물이 많아요.`,care:`어른이 되면 해마다 눈 검사를 받아요. 늦게 알면 녹내장이 될 수 있어요.`},{name:`귀 염증·피부 알레르기`,what:`귀가 덮여 있어 습기가 차기 쉽고, 피부가 예민한 편이에요.`,sign:`귀에서 냄새가 나거나 머리를 자주 털고, 발을 계속 핥아요.`,care:`목욕이나 수영 뒤에는 귀를 잘 말려 줘요.`}]},{look:`black`,breed:`래브라도 리트리버`,intro:`래브라도 리트리버는 힘이 넘치고 먹는 걸 정말 좋아해요. 그래서 조심할 병도 있어요.`,conditions:[{name:`고관절·팔꿈치 이형성증`,what:`엉덩이와 팔꿈치 관절이 꼭 맞물리지 않게 자라는 병이에요.`,sign:`일어날 때 힘들어하거나, 산책하다 다리를 절어요.`,care:`살이 찌지 않게 하고, 어릴 때 무리한 점프를 줄여요. 엑스레이로 확인해요.`},{name:`비만`,what:`래브라도 중에는 배부름을 잘 못 느끼게 하는 유전자를 가진 아이가 많아요. 늘 배고파 보여요.`,sign:`갈비뼈가 손에 잘 안 만져지고 허리 잘록함이 없어져요.`,care:`사료는 저울로 재서 주고, 간식은 하루 먹는 양의 10%를 넘기지 않아요.`},{name:`운동하다 주저앉는 병 (EIC)`,what:`아주 신나게 뛰다 보면 뒷다리에 힘이 빠져 주저앉는 유전병이에요.`,sign:`격한 공놀이 몇 분 뒤 뒷다리가 휘청이며 주저앉아요. 쉬면 보통 돌아와요.`,care:`증상이 보이면 바로 쉬게 하고, 더운 날 격한 놀이는 피해요. 유전자 검사로 알 수 있어요.`},{name:`진행성 망막 위축 (눈)`,what:`눈 속 빛을 느끼는 부분이 조금씩 약해지는 유전병이에요.`,sign:`어두운 곳에서 잘 부딪히고, 밤 산책을 무서워해요.`,care:`유전자 검사와 눈 검사로 미리 알 수 있어요. 집 안 가구 배치를 자주 바꾸지 않아요.`}]},{look:`shiba`,breed:`시바견`,intro:`시바견은 깔끔하고 독립심이 강해요. 피부와 눈, 무릎을 잘 살펴 주세요.`,conditions:[{name:`아토피 피부염·알레르기`,what:`피부가 예민해서 먼지나 음식 때문에 가려움이 잘 생겨요.`,sign:`발을 계속 핥거나 몸을 긁고, 눈가·겨드랑이가 빨개요.`,care:`가려워하는 곳과 때를 적어 두면 원인을 찾는 데 도움이 돼요. 수의사와 상의해서 사료를 골라요.`},{name:`슬개골 탈구 (무릎)`,what:`무릎뼈가 제자리에서 빠졌다 들어갔다 하는 병이에요.`,sign:`걷다가 한쪽 뒷다리를 들고 깡충깡충 뛰어요.`,care:`미끄러운 바닥에는 매트를 깔고, 높은 곳에서 뛰어내리지 않게 해요.`},{name:`녹내장 (눈)`,what:`눈 속 압력이 높아져 시력이 나빠지는 병이에요. 빨리 치료해야 해요.`,sign:`눈이 빨갛고 뿌옇게 보이거나, 한쪽 눈을 찡그리고 아파해요.`,care:`이런 모습이 보이면 그날 바로 병원에 가요. 어른이 되면 눈 압력 검사를 받아요.`},{name:`나이 들어 생기는 인지기능장애`,what:`사람의 치매처럼 나이가 들면 기억과 생각하는 힘이 약해질 수 있어요.`,sign:`밤에 이유 없이 울거나, 같은 자리를 빙글빙글 돌고, 구석에 끼어 못 나와요.`,care:`산책과 냄새 맡기 놀이로 머리를 자주 쓰게 해 주고, 노령기에는 검진을 자주 받아요.`}]},{look:`cream`,breed:`크림 골든 리트리버`,intro:`크림 골든 리트리버는 털색만 밝은 골든 리트리버예요. 그래서 조심할 병도 골든 리트리버와 같아요. 하얀 털은 눈물 자국이나 빨개진 피부가 잘 보이니 눈가와 발도 살펴 주세요.`,conditions:[{name:`고관절·팔꿈치 이형성증`,what:`엉덩이와 팔꿈치 관절이 꼭 맞물리지 않게 자라는 병이에요. 크면서 관절이 닳아 아파요.`,sign:`일어날 때 힘들어하거나, 뒷다리를 절거나, 토끼처럼 두 다리를 모아 뛰어요.`,care:`살이 찌지 않게 하고, 어릴 때 높은 곳 점프나 계단 오르내리기를 줄여요. 엑스레이로 확인해요.`},{name:`암 (혈관육종·림프종)`,what:`골든 리트리버는 다른 견종보다 암이 잘 생기는 편이에요.`,sign:`몸에 혹이 만져지거나, 갑자기 기운이 없고 잇몸이 하얗게 보여요.`,care:`쓰다듬을 때 혹이 있는지 살피고, 7살이 넘으면 해마다 건강검진을 받아요.`},{name:`대동맥판 아래 협착 (심장)`,what:`심장에서 피가 나가는 길이 좁게 태어나는 병이에요.`,sign:`쉽게 지치거나, 운동하다 쓰러지기도 해요. 청진기로 심장 소리가 이상하게 들려요.`,care:`접종 때 심장 소리를 들어 보고, 이상하면 심장 초음파로 확인해요.`},{name:`포도막염 (눈)`,what:`눈 안쪽에 염증이 생기는 병이에요. 골든 리트리버에게 잘 생기는 종류가 따로 있어요.`,sign:`눈이 빨갛거나 눈을 자주 찡그리고 눈물이 많아요.`,care:`어른이 되면 해마다 눈 검사를 받아요. 늦게 알면 녹내장이 될 수 있어요.`},{name:`귀 염증·피부 알레르기`,what:`귀가 덮여 있어 습기가 차기 쉽고, 피부가 예민한 편이에요.`,sign:`귀에서 냄새가 나거나 머리를 자주 털고, 발을 계속 핥아요.`,care:`목욕이나 수영 뒤에는 귀를 잘 말려 줘요.`}]}],K={balance:Dt,chapters:Ot,tasks:kt,shop:At,attend
